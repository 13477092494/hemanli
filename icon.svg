<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c5c5"/>
      <stop offset="55%" stop-color="#e09a9c"/>
      <stop offset="100%" stop-color="#c4797b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 柔和阴影 -->
  <rect width="512" height="512" rx="116" fill="#000" opacity="0.04"/>
  <g transform="translate(256 256)">
    <!-- 花瓣 -->
    <g fill="#ffffff">
      <ellipse cx="0" cy="-96" rx="50" ry="74"/>
      <ellipse cx="0" cy="-96" rx="50" ry="74" transform="rotate(72)"/>
      <ellipse cx="0" cy="-96" rx="50" ry="74" transform="rotate(144)"/>
      <ellipse cx="0" cy="-96" rx="50" ry="74" transform="rotate(216)"/>
      <ellipse cx="0" cy="-96" rx="50" ry="74" transform="rotate(288)"/>
    </g>
    <!-- 花心 -->
    <circle cx="0" cy="0" r="40" fill="#f7d9a8"/>
    <circle cx="0" cy="0" r="24" fill="#e9a84a"/>
    <!-- 高光 -->
    <circle cx="-10" cy="-8" r="9" fill="#fff" opacity="0.6"/>
  </g>
  <!-- 藤蔓装饰（呼应禾蔓里） -->
  <path d="M120 380 Q160 430 210 420" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M392 380 Q352 430 302 420" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
