function deleteNoti(id){
  if(!confirm('删除？'))return;
  DB.notifications=DB.notifications.filter(n=>n.id!==id);
  saveDB();syncChannel();renderCurrentRoute();toast('已删除');
}
function sendNotification(channel){
  const cust=document.getElementById('noti-cust').value.trim();
  const content=document.getElementById('noti-content').value.trim();
  if(!cust||!content){toast('请填写客户和内容');return;}
  DB.notifications.unshift({id:genId('nt'),date:ymd(new Date())+' '+hm(new Date()),customerName:cust,content,type:channel==='sms'?'短信':channel==='wx'?'微信':'复制',createdAt:Date.now()});
  saveDB();syncChannel();drawNotiList();toast('已记录通知（'+cust+' '+(channel==='sms'?'短信':channel==='wx'?'微信':'仅复制')+'）');
}
function copyNotification(){
  const c=document.getElementById('noti-content').value;
  navigator.clipboard.writeText(c).then(()=>toast('已复制内容到剪贴板'));
}
function bulkNoti(type){
  let list=[];
  let content='';
  if(type==='expire'){
    list=DB.customers.filter(c=>{if(!c.membershipExpire)return false;const diff=(new Date(c.membershipExpire)-new Date())/(1000*60*60*24);return diff<=7&&diff>=0;});
    content=c=>`【禾蔓里】亲爱的${c.name}，您的${getMembershipName(c.membershipAmount)}将于${c.membershipExpire}到期，余额¥${c.membershipBalance||0}，欢迎续费。`;
  }else if(type==='points'){
    list=DB.customers.filter(c=>(+c.points||0)>0);
    content=c=>`【禾蔓里】亲爱的${c.name}，您当前积分${c.points||0}分，100分=1元，可兑换卸甲/补色等好礼，欢迎到店。`;
  }else if(type==='birthday'){
    const today=new Date(),td=today.getMonth()+'-'+today.getDate();
    list=DB.customers.filter(c=>{if(!c.birthday)return false;const bd=c.birthday.substr(5);return bd===td;});
    content=c=>`【禾蔓里】亲爱的${c.name}，今天是您的生日，凭此消息可到店领取生日礼遇一份哦~`;
  }else if(type==='tomorrow'){
    const tom=new Date();tom.setDate(tom.getDate()+1);
    const td=ymd(tom);
    list=DB.appointments.filter(a=>a.date===td&&a.status==='confirmed').map(a=>{const c=DB.customers.find(x=>x.id===a.customerId);return c||{name:a.name,phone:a.phone};});
    content=c=>`【禾蔓里】亲爱的${c.name}，提醒您明天有预约美甲服务，期待您的光临~`;
  }
  if(list.length===0){toast('无匹配客户');return;}
  if(!confirm(`将给 ${list.length} 位客户发送提醒，是否继续？`))return;
  list.forEach(c=>{
    DB.notifications.unshift({id:genId('nt'),date:ymd(new Date())+' '+hm(new Date()),customerName:c.name,content:content(c),type:'系统批量',createdAt:Date.now()});
  });
  saveDB();syncChannel();renderCurrentRoute();toast(`已批量记录 ${list.length} 条`);
}

function addItem(){
  const name=prompt('款式名称','新款式');
  if(!name)return;
  const price=parseFloat(prompt('价格','100'))||100;
  const duration=parseInt(prompt('预估耗时(分钟)','60'))||60;
  DB.items.push({id:genId('i'),name,price,duration,category:'其他',hot:false,pointsMultiple:1});
  saveDB();renderCurrentRoute();
}
function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`hemanli_${ymd(new Date())}.json`;a.click();
  toast('已导出');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!confirm('导入将覆盖现有数据，确定？'))return;
      Object.assign(DB,data);saveDB();syncChannel();renderCurrentRoute();toast('已导入');
    }catch(e){toast('导入失败');}
  };
  r.readAsText(file);
}
function clientShareUrl(){
  const base=DB.settings.cloud&&DB.settings.cloud.url||'';
  const key=DB.settings.cloud&&DB.settings.cloud.key||'';
  const u=getUrlCloud();
  const url=base||u.url, k=key||u.key;
  let q='';
  if(url){q+='?sb_url='+encodeURIComponent(url);}
  if(k){q+=(q?'&':'?')+'sb_key='+encodeURIComponent(k);}
  return location.origin+location.pathname+q+'#customer';
}
function drawQRCode(){
  const url=clientShareUrl();
  // 简易二维码（用api.qrserver.com如果在线）或本地模拟
  const qr=document.getElementById('qrcode');
  qr.innerHTML=`<div style="font-size:80px">📱</div><p style="margin-top:8px;font-size:12px">客户扫码访问</p>`;
  // 使用Google Chart API生成（如果在线）
  const img=new Image();
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);
  img.onload=()=>{qr.innerHTML='';qr.appendChild(img);};
  img.onerror=()=>{
    // 离线 fallback - 显示可复制的链接
    qr.innerHTML='<div style="padding:14px;background:#fffaf8;border-radius:6px">'+url+'</div>';
  };
}

let _cuStyles=[]; // [{name,image}]
function addCuStyleRow(prefill){
  const id=genId('st');
  const row={id,name:prefill&&prefill.name||'',image:prefill&&prefill.image||''};
  _cuStyles.push(row);
  renderCuStyleRows();
}
function removeCuStyleRow(id){
  _cuStyles=_cuStyles.filter(r=>r.id!==id);
  renderCuStyleRows();
}
function renderCuStyleRows(){
  const box=document.getElementById('cu-styles');if(!box)return;
  const max=DB.settings.imageMaxCount||6;
  const totalImgs=_cuStyles.filter(r=>r.image).length;
  box.innerHTML=_cuStyles.map((r,i)=>`
    <div style="display:flex;gap:8px;align-items:center;padding:8px;background:var(--bg-2);border-radius:8px" data-id="${r.id}">
      <input class="cu-st-name" data-id="${r.id}" value="${r.name}" placeholder="款式 ${i+1}（如 猫眼甲）" style="flex:1" list="cu-items-list">
      <datalist id="cu-items-list">${DB.items.map(it=>`<option value="${it.name}">`).join('')}</datalist>
      <input type="file" accept="image/*" style="display:none" data-id="${r.id}" onchange="onCuStyleImg(event,'${r.id}')">
      <button type="button" class="btn sm" onclick="this.previousElementSibling.click()" title="上传图片" style="flex:none">${r.image?'🖼️':'📷'}</button>
      ${r.image?`<button type="button" class="btn sm danger" onclick="removeCuStyleImg('${r.id}')">×</button>`:''}
      <button type="button" class="btn sm danger" onclick="removeCuStyleRow('${r.id}')">删</button>
    </div>
    ${r.image?`<div style="margin-left:8px"><img src="${r.image}" style="width:60px;height:60px;object-fit:cover;border-radius:6px"></div>`:''}
  `).join('');
  // 控制上传按钮可用
  const canAdd=totalImgs<max;
  box.querySelectorAll('input[type=file]').forEach(f=>f.disabled=!canAdd&&!_cuStyles.find(r=>r.id===f.dataset.id).image);
}
async function onCuStyleImg(ev,rowId){
  const file=ev.target.files[0];if(!file)return;
  try{
    const base64=await compressImage(file);
    const row=_cuStyles.find(r=>r.id===rowId);if(row){row.image=base64;renderCuStyleRows();}
  }catch(e){toast('图片处理失败');}
}
function removeCuStyleImg(rowId){
  const row=_cuStyles.find(r=>r.id===rowId);if(row){row.image='';renderCuStyleRows();}
}

function renderCuDaySlots(){
  const date=document.getElementById('cu-date').value;
  if(!date)return;
  const interval=DB.settings.appointmentInterval||30;
  const bookings=DB.appointments.filter(a=>a.date===date&&a.status!=='cancelled');
  // 收集已占用时间段
  const booked=new Set();
  bookings.forEach(b=>{
    const s=parseHM(b.startTime),e=parseHM(b.endTime);
    for(let h=s.h*60+s.m,end=e.h*60+e.m;h<end;h+=interval){booked.add(h);}
  });
  // 生成营业时间段
  const oh=parseHM(DB.settings.openTime),ch=parseHM(DB.settings.closeTime);
  const startMin=oh.h*60+oh.m,endMin=ch.h*60+ch.m;
  let html='';
  for(let m=startMin;m<endMin;m+=interval){
    const from=m,to=Math.min(endMin,m+interval);
    const fH=Math.floor(from/60),fM=from%60;
    const tH=Math.floor(to/60),tM=to%60;
    const fromT=String(fH).padStart(2,'0')+':'+String(fM).padStart(2,'0');
    const toT=String(tH).padStart(2,'0')+':'+String(tM).padStart(2,'0');
    const isBooked=booked.has(m);
    html+=`<div class="time-slot ${isBooked?'disabled':''}" data-time="${fromT}" onclick="if(this.classList.contains('disabled'))return;document.getElementById('cu-time').value='${fromT}';document.querySelectorAll('#cu-day-slots .time-slot').forEach(s=>s.classList.remove('selected'));this.classList.add('selected')">${fromT}-${toT}${isBooked?' (已约)':''}</div>`;
  }
  document.getElementById('cu-day-slots').innerHTML=html||'<p class="text-muted">所选日期不可预约</p>';
}

function submitCustomerAppoint(){
  const name=document.getElementById('cu-name').value.trim();
  const phone=document.getElementById('cu-phone').value.trim();
  const date=document.getElementById('cu-date').value;
  const time=document.getElementById('cu-time').value;
  const note=document.getElementById('cu-note').value.trim();
  if(!name||!phone||!date||!time){toast('请完整填写姓名/手机/日期/时间');return;}
  // 收集款式
  const styles=_cuStyles.map(r=>({name:(r.name||'').trim(),image:r.image||''})).filter(r=>r.name||r.image);
  if(!styles.length){toast('请至少填写一个款式名称');return;}
  const totalDur=styles.reduce((s,r)=>s+((DB.items.find(i=>i.name===r.name)||{}).duration||60),0);
  const eH=parseInt(time.split(':')[0])+Math.floor(totalDur/60);
  const eM=parseInt(time.split(':')[1])+(totalDur%60);
  const endTime=String(Math.floor((eH*60+eM)/60)%24).padStart(2,'0')+':'+String((eH*60+eM)%60).padStart(2,'0');

  // 找客户或创建
  let customer=DB.customers.find(c=>c.name===name&&c.phone===phone);
  const isNewCustomer=!customer;
  if(!customer){
    customer={id:genId('c'),name,phone,points:0,createdAt:Date.now()};
    DB.customers.push(customer);
  }
  customerCurrentId=customer.id;
  localStorage.setItem('hemanli_customer_id',customer.id);
  // 邀请码绑定（来自 ?ref=xxx 邀请链接）
  if(isNewCustomer){
    const ref=getUrlRef();
    if(ref){
      const r=applyReferral(customer.id,ref);
      if(r.ok)setTimeout(()=>toast('🎉 '+r.msg),1600);
    }
  }
  const appt={
    id:genId('a'),date,startTime:time,endTime,
    customerId:customer.id,name,phone,
    styleNames:styles.map(s=>s.name),
    item:styles.map(s=>s.name).join('+'),
    images:styles.map(s=>s.image).filter(Boolean),
    imagesByName:styles.filter(s=>s.image).map(s=>({name:s.name,image:s.image})),
    quotedPrice:0,deposit:0,depositPaid:false,payMethod:'cash',
    technicianId:'',
    note,status:'pending',createdAt:Date.now(),source:'customer'
  };
  DB.appointments.unshift(appt);
  saveDB();syncChannel();
  if(CLOUD.ready&&CLOUD.mode==='client'){CLOUD.pushAppt(appt);if(!CLOUD.apptWatcher)CLOUD.watchAppts(list=>applyApptsForClient(list));}
  toast('预约成功！店家稍后会确认并报价');
  _cuStyles=[];
  setTimeout(()=>{location.hash='#customer/mine';},800);
}

function customerMyAppoints(){

  const groups={
    quoted:all.filter(a=>a.status==='pending'&&a.quotedPrice>0&&!a.depositPaid),
    pending:all.filter(a=>a.status==='pending'&&(!a.quotedPrice||a.depositPaid===false&&a.quotedPrice===0)),
    confirmed:all.filter(a=>a.status==='confirmed'||(a.status==='pending'&&a.depositPaid)),
    done:all.filter(a=>a.status==='completed'||a.status==='cancelled')
  };
  const labels={quoted:'💰 待付定金',pending:'⏳ 待报价',confirmed:'✅ 已预约',done:'📦 历史'};
  const keys=['quoted','pending','confirmed','done'];
  const counts=Object.fromEntries(keys.map(k=>[k,groups[k].length]));
  let active=window._myTab||(counts.quoted?'quoted':counts.pending?'pending':counts.confirmed?'confirmed':'done');
  window._myTab=active;
  const arr=groups[active].sort((a,b)=>b.date.localeCompare(a.date)||b.startTime.localeCompare(a.startTime));
  const renderCard=a=>{
    const imgs=(a.imagesByName&&a.imagesByName.length)?a.imagesByName:(a.images||[]).map(u=>({name:'',image:u}));
    const statusMap={pending:['待确认','warning'],confirmed:['已确认','primary'],completed:['已完成','success'],cancelled:['已取消','danger']};
    const [s,c]=statusMap[a.status]||['',''];
    const canEdit=a.status==='pending'&&!a.depositPaid;
    const canPayDeposit=a.status==='pending'&&a.quotedPrice>0&&!a.depositPaid;
    const canCancel=a.status!=='cancelled'&&a.status!=='completed';
    return `<div class="card" style="margin-bottom:12px;box-shadow:var(--shadow-2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong>${a.styleNames&&a.styleNames.length?a.styleNames.join(' + '):a.item||'(款式待定)'}</strong>
        <span class="tag ${c}">${s}</span>
      </div>
      <div class="text-muted" style="font-size:12px">📅 ${a.date} ⏰ ${a.startTime}-${a.endTime}</div>
      ${imgs.length?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${imgs.slice(0,4).map(o=>`<img src="${o.image}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="showImgPreview('${o.image}')">`).join('')}${imgs.length>4?`<div style="width:60px;height:60px;background:var(--bg-2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:12px">+${imgs.length-4}</div>`:''}</div>`:''}
      ${a.note?`<div class="text-muted mt-1" style="font-size:11px">备注：${a.note}</div>`:''}
      ${a.quotedPrice?`<div style="margin-top:8px;padding:10px 12px;background:#fffaf8;border-radius:8px;font-size:13px">
        <div>💵 报价：<strong style="color:var(--primary-dark);font-size:16px">¥${(+a.quotedPrice).toFixed(0)}</strong>${a.deposit?` · 定金 ¥${a.deposit}`:''}</div>
        ${a.depositPaid?'<div class="text-success" style="font-size:11px;margin-top:3px">✓ 定金已付</div>':'<div class="text-muted" style="font-size:11px;margin-top:3px">⏳ 待付定金</div>'}
      </div>`:''}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        ${canPayDeposit?`<button class="btn sm primary" onclick="payDeposit('${a.id}')">💰 支付定金 ¥${a.deposit||Math.round((+a.quotedPrice)*0.3)}</button>`:''}
        ${canEdit?`<button class="btn sm" onclick="customerAppointEdit('${a.id}')">✏️ 修改</button>`:''}
        ${canCancel?`<button class="btn sm danger" onclick="cancelMyAppt('${a.id}')">取消</button>`:''}
      </div>
    </div>`;
  };
  return `
    <div class="sch-tabs" style="margin-bottom:14px">
      ${keys.map(k=>`<div class="sch-tab ${active===k?'active':''}" onclick="window._myTab='${k}';renderCustomerPage()">${labels[k]} (${counts[k]})</div>`).join('')}
    </div>
    ${arr.length?arr.map(renderCard).join(''):'<div class="empty"><div class="icon">📭</div>暂无</div>'}
  `;
}

function payDeposit(apptId){
  const a=DB.appointments.find(x=>x.id===apptId);if(!a)return;
  const dep=a.deposit||Math.round((+a.quotedPrice)*0.3);

  a.deposit=dep;
  a.depositPaid=true;

  a.status='confirmed';
  DB.transactions.unshift({
    id:genId('tx'),date:ymd(new Date()),type:'定金',
    amount:dep,name:'预约定金-'+(a.styleNames&&a.styleNames.join('+')||a.item),
    customerId:a.customerId,customerName:a.name||'',

function customerAppointEdit(id){
  const a=DB.appointments.find(x=>x.id===id);if(!a)return;
  _cuStyles=[];
  const names=a.styleNames&&a.styleNames.length?a.styleNames:(a.item?[a.item]:['']);
  const byName=(a.imagesByName||[]).reduce((m,o)=>{m[o.name]=o.image;return m;},{});
  const others=(a.images||[]).filter(u=>!Object.values(byName).includes(u));
  names.forEach((n,i)=>{
    _cuStyles.push({id:genId('st'),name:n,image:byName[n]||(i===0?others[0]||'':'')});
  });
  if(!_cuStyles.length)_cuStyles=[{id:genId('st'),name:'',image:''}];
  showModal('✏️ 修改预约',customerAppointForm().replace(/<button[^>]*onclick="submitCustomerAppoint\(\)">[^<]+<\/button>/,`<button class="btn primary" style="width:100%;padding:14px" onclick="saveCustomerAppointEdit('${a.id}')">💾 保存修改</button>`),``);

function recalcQuote(){
  const rows=[...document.querySelectorAll('.qp')];
  const tierTxt=document.querySelector('#qrows').parentElement.querySelector('.text-light,.text-muted')||null;
  let rate=1;
  const a=DB.appointments.find(x=>x.id===window._quotingAppt);
  const cust=a&&a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
  if(cust&&cust.membershipAmount&&MEMBER_TIERS[cust.membershipAmount])rate=MEMBER_TIERS[cust.membershipAmount].discount;
  let orig=0,final=0;
  rows.forEach(inp=>{
    const p=parseFloat(inp.value)||0;
    orig+=p;
    const out=document.getElementById('qpf-'+inp.dataset.idx);
    if(out)out.textContent='¥'+(p*rate).toFixed(0);
  });
  final=orig*rate;
  document.getElementById('qtotal').textContent='¥'+final.toFixed(0);
  const dep=parseFloat(document.getElementById('q-deposit')?.value)||0;
  const tip=document.getElementById('q-tip');
  if(tip){
    if(dep>final){tip.innerHTML='<span class="text-danger">⚠️ 定金超过总金额，请调整</span>';}
    else if(dep>0){tip.innerHTML=`客户需支付定金 <strong>¥${dep.toFixed(0)}</strong>，尾款到店付 <strong>¥${(final-dep).toFixed(0)}</strong>`;}
  }
}
function submitQuote(apptId){
  const a=DB.appointments.find(x=>x.id===apptId);if(!a)return;
  const rows=[...document.querySelectorAll('.qp')];
  const names=a.styleNames&&a.styleNames.length?a.styleNames:(a.item?[a.item]:[]);
  const quotes=rows.map((inp,i)=>({name:names[i]||('款式'+(i+1)),price:parseFloat(inp.value)||0}));
  const cust=a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
  const rate=cust&&cust.membershipAmount&&MEMBER_TIERS[cust.membershipAmount]?MEMBER_TIERS[cust.membershipAmount].discount:1;
  const origTotal=quotes.reduce((s,q)=>s+q.price,0);
  const final=+(origTotal*rate).toFixed(0);
  const deposit=Math.min(parseFloat(document.getElementById('q-deposit').value)||0,final);
  const expire=document.getElementById('q-expire').value;
  a.quotes=quotes;
  a.quotedPrice=final;
  a.quotedOriginal=origTotal;
  a.deposit=deposit;
  a.depositPaid=false;
  a.status='pending'; // 等客户付定金
  a.quotedAt=Date.now();
  if(expire)a.quoteExpire=expire;
  // 价格记忆
  quotes.forEach(q=>{if(q.price>0)rememberPrice(q.name,q.price);});
  saveDB();syncChannel();
  if(CLOUD.ready)CLOUD.pushAppt(a);
  document.querySelector('.modal-mask').remove();
  renderRoute();
  toast('已报价 ¥'+final+'（定金 ¥'+deposit+'），客户将在手机上看到');
}

    const note=document.getElementById('na-note').value.trim();

}

function checkReminders(){
  // 弹幕提醒：即将到预约
  const interval=DB.settings.appointmentInterval||30;
  const now=new Date();
  DB.appointments.forEach(a=>{
    if(a.status!=='confirmed')return;
    const apptTime=new Date(a.date+'T'+a.startTime);
    const diffMin=(apptTime-now)/60000;
    if(diffMin>0&&diffMin<=15){
      const key='reminded_'+a.id+'_'+Math.floor(diffMin/15);
      if(sessionStorage.getItem(key))return;
      sessionStorage.setItem(key,'1');
      showDanmu(`${a.name||'客户'}的预约 ${a.startTime} 还有${Math.ceil(diffMin)}分钟，请准备！`);
    }
  });
}
