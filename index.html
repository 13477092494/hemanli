<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d99a9a">
<title>禾蔓里·美甲美睫工作室</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="禾蔓里">
<style>
/* ========== CSS变量和基础重置 ========== */
:root{
  --primary:#d99a9a;
  --primary-dark:#c4797b;
  --primary-light:#f7e3e3;
  --accent:#e8b4b8;
  --bg:#faf6f5;
  --bg-2:#fff5f3;
  --card:#ffffff;
  --text:#2d2424;
  --text-light:#7a6f6f;
  --border:#f0e3e3;
  --success:#7ab87a;
  --warning:#e8b04c;
  --danger:#d96666;
  --gold:#d4a85a;
  --silver:#a8a8a8;
  --shadow:0 4px 20px rgba(217,154,154,.12);
  --shadow-2:0 2px 8px rgba(0,0,0,.06);
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);outline:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;width:100%;transition:border-color .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--primary);}
textarea{resize:none;min-height:80px;line-height:1.6;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ========== 工作台布局(iPad) ========== */
.workspace{
  display:flex;
  height:100vh;
  background:var(--bg);
}
/* 左侧导航 */
.workspace-sidebar{
  width:240px;
  background:linear-gradient(180deg,#fff 0%,#fffaf8 100%);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.sidebar-brand{
  padding:24px 20px 18px;
  text-align:center;
  border-bottom:1px solid var(--border);
}
.sidebar-brand .brand-avatar{width:64px;height:64px;border-radius:14px;display:block;margin:0 auto 10px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.sidebar-brand h1{font-size:18px;color:var(--primary-dark);font-weight:600;}
.sidebar-brand .en{font-size:11px;color:var(--text-light);margin-top:4px;letter-spacing:1px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px;}
.nav-group{margin-bottom:12px;}
.nav-group-title{padding:8px 12px 4px;font-size:11px;color:var(--text-light);letter-spacing:1px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  color:var(--text);
  font-size:13.5px;
  cursor:pointer;
  position:relative;
  transition:all .15s;
}
.nav-item:hover{background:var(--primary-light);}
.nav-item.active{background:var(--primary);color:#fff;font-weight:500;}
.nav-item .badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--danger);color:#fff;font-size:10px;
  padding:2px 6px;border-radius:10px;min-width:18px;text-align:center;
}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-light);text-align:center;}

/* 主区 */
.workspace-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.workspace-header{
  height:60px;
  padding:0 24px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.header-title{font-size:18px;font-weight:600;color:var(--text);}
.header-actions{display:flex;gap:10px;align-items:center;}
.btn{
  padding:8px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  background:var(--primary-light);color:var(--primary-dark);
  border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;
}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn.danger{background:#ffeaea;color:var(--danger);}
.btn.danger:hover{background:var(--danger);color:#fff;}
.btn.success{background:#e6f4e6;color:var(--success);}
.btn.success:hover{background:var(--success);color:#fff;}
.btn.gold{background:linear-gradient(135deg,#f7e1b3,#e8c479);color:#8a6420;}
.btn.sm{padding:5px 10px;font-size:12px;}
.workspace-content{flex:1;overflow-y:auto;padding:24px;}

/* 卡片 */
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-2);margin-bottom:16px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.row{display:flex;gap:12px;}
.col{flex:1;}

/* 数据卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{
  padding:18px;border-radius:var(--radius);
  background:linear-gradient(135deg,#fff,#fffaf8);
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
.stat-card.green::before{background:var(--success);}
.stat-card.gold::before{background:var(--gold);}
.stat-card.danger::before{background:var(--danger);}
.stat-label{font-size:12px;color:var(--text-light);margin-bottom:6px;}
.stat-value{font-size:24px;font-weight:700;color:var(--text);}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;}
.tbl th{background:var(--bg-2);padding:12px 14px;font-size:12px;text-align:left;color:var(--text-light);font-weight:500;border-bottom:1px solid var(--border);}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover{background:var(--bg-2);}

/* 标签 */
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;}
.tag.gold{background:#fff4d4;color:#8a6420;}
.tag.silver{background:#e8e8e8;color:#555;}
.tag.normal{background:#f0f0f0;color:#777;}
.tag.success{background:#e6f4e6;color:var(--success);}
.tag.warning{background:#fff4d4;color:var(--warning);}
.tag.danger{background:#ffeaea;color:var(--danger);}
.tag.primary{background:var(--primary-light);color:var(--primary-dark);}

/* 表单 */
.form-item{margin-bottom:14px;}
.form-label{display:block;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:500;}
.form-label .req{color:var(--danger);margin-left:2px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* 模态框 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:var(--radius-lg);width:600px;max-width:90vw;
  max-height:85vh;display:flex;flex-direction:column;overflow:hidden;
  animation:pop .25s;
}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;font-weight:600;}
.modal-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-light);}
.modal-close:hover{background:var(--bg-2);}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* Toast */
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:9999;animation:popIn .2s;}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* 云端连接状态药丸（常驻悬浮） */
.cloud-pill{position:fixed;bottom:16px;right:14px;z-index:9000;display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:default;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);border:1px solid var(--border);color:var(--text-light);
  user-select:none;transition:all .2s;max-width:60vw;}
.cloud-pill.pill-top{top:10px;bottom:auto;right:12px;}
.cloud-pill .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:none;}
.cloud-pill.online{color:#1a7f37;border-color:#b7e4c7;background:#f0fdf4;}
.cloud-pill.online .dot{background:#1a7f37;}
.cloud-pill.connecting{color:#9a6700;border-color:#ffe8a3;background:#fffbeb;}
.cloud-pill.connecting .dot{background:#f0a020;animation:blink 1s infinite;}
.cloud-pill.error{color:#b42318;border-color:#f6c9c3;background:#fff5f4;}
.cloud-pill.error .dot{background:#e5484d;}
.cloud-pill.off{color:#868e96;}
.cloud-pill.off .dot{background:#bbb;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.cloud-pill.clickable{cursor:pointer;}
.cloud-pill.clickable:hover{filter:brightness(.98);}

/* 客户小程序布局 */
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:#fff;position:relative;}
.app-header{
  height:60px;padding:0 16px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;position:relative;
}
.app-header h1{font-size:16px;font-weight:600;text-align:center;}
.brand-mark{width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 4px 14px rgba(196,121,123,.25);border:2px solid #fff;}
.app-content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;background:#fff;}
.app-tabbar{
  position:absolute;left:0;right:0;bottom:0;height:64px;
  background:#fff;border-top:1px solid var(--border);
  display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-light);font-size:11px;}
.tab-item.active{color:var(--primary);}
.tab-item .icon{font-size:22px;}
.tab-item{position:relative;}
.tab-dot{position:absolute;top:9px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px #fff;}

/* 客户端打卡送礼 */
.cu-gtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;}
.cu-gtabs::-webkit-scrollbar{display:none;}
.cu-gtab{flex:0 0 auto;padding:7px 13px;border-radius:16px;background:#fff;border:1px solid var(--border);font-size:12.5px;color:var(--text-light);white-space:nowrap;}
.cu-gtab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.cu-dot{width:30px;height:30px;border-radius:50%;margin:0 auto;background:#f2ecec;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
.cu-dot.on{background:var(--primary);border-color:var(--primary);}
.cu-dot.today{box-shadow:0 0 0 3px rgba(214,150,150,.22);}
.cu-way{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.cu-way:last-child{border-bottom:none;}
.cu-shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cu-goods{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;box-shadow:var(--shadow-2);}
.cu-ticket{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border);}
.cu-ticket:last-child{border-bottom:none;}
.cu-ticket.used{opacity:.5;}

/* 客户卡片 */
.user-card{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;
}
.user-row{display:flex;justify-content:space-between;align-items:center;}
.user-name{font-size:18px;font-weight:600;}
.user-tag{font-size:11px;padding:3px 10px;background:rgba(255,255,255,.2);border-radius:12px;}
.user-stats{display:flex;gap:16px;margin-top:14px;}
.user-stat{flex:1;text-align:center;}
.user-stat .v{font-size:20px;font-weight:700;}
.user-stat .l{font-size:11px;opacity:.85;margin-top:2px;}

/* 时间段网格 */
.time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.time-slot{
  padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  text-align:center;font-size:13px;background:#fff;cursor:pointer;
  transition:all .15s;
}
.time-slot:hover{border-color:var(--primary);}
.time-slot.selected{background:var(--primary);color:#fff;border-color:var(--primary);}
.time-slot.disabled{background:#f5f5f5;color:#bbb;cursor:not-allowed;text-decoration:line-through;}

/* 营业时间块 */
.tip-block{
  background:linear-gradient(135deg,#fff8e1,#fff3cc);
  border-left:4px solid var(--gold);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:16px;
}
.tip-block .t{font-weight:600;color:#8a6420;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.tip-block .c{font-size:12.5px;line-height:1.8;color:#6b5a3a;}

/* 左滑删除 */
.swipe-wrap{position:relative;overflow:hidden;background:#fff;border-radius:var(--radius-sm);margin-bottom:8px;}
.swipe-content{padding:12px;background:#fff;transition:transform .2s;position:relative;z-index:2;}
.swipe-content.swiped{transform:translateX(-80px);}
.swipe-action{
  position:absolute;right:0;top:0;bottom:0;width:80px;
  background:var(--danger);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  z-index:1;
}

/* 弹幕提醒 */
.danmu{
  position:fixed;left:20px;right:20px;bottom:24px;z-index:999;
  background:linear-gradient(135deg,#fff8e1,#fff3cc);
  border-left:4px solid var(--warning);
  padding:12px 16px;border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(232,176,76,.3);
  animation:slideUp .3s;font-size:13px;
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

/* 分析图表 */
.chart-box{height:220px;position:relative;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-light);}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;}

.empty{text-align:center;padding:48px 20px;color:var(--text-light);}
.empty .icon{font-size:48px;margin-bottom:14px;opacity:.4;}

/* 链接抓取 */
.link-input-row{display:flex;gap:8px;margin-bottom:14px;}
.link-input-row input{flex:1;}

.preview-card{
  border:1px dashed var(--primary);
  border-radius:var(--radius);padding:14px;
  background:#fffaf8;margin-bottom:14px;
}
.preview-cover{width:80px;height:80px;border-radius:var(--radius-sm);background:#f0e3e3;object-fit:cover;flex-shrink:0;}
.preview-row{display:flex;gap:14px;}

/* 提醒 */
.notice-bar{
  background:var(--primary-light);color:var(--primary-dark);
  padding:10px 14px;border-radius:var(--radius-sm);
  font-size:12.5px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}

.text-danger{color:var(--danger);}
.text-success{color:var(--success);}
.text-warning{color:var(--warning);}
.text-muted{color:var(--text-light);}
.text-center{text-align:center;}
.text-right{text-align:right;}
.font-bold{font-weight:600;}

.mt-1{margin-top:8px;}.mt-2{margin-top:16px;}.mt-3{margin-top:24px;}
.mb-1{margin-bottom:8px;}.mb-2{margin-bottom:16px;}.mb-3{margin-bottom:24px;}

/* 时间块 */
.hours-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.day-card{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  overflow:hidden;
}
.day-head{padding:8px 12px;background:var(--bg-2);font-size:13px;font-weight:500;text-align:center;}
.day-body{padding:8px;display:flex;flex-wrap:wrap;gap:4px;}
.hour-chip{
  font-size:11px;padding:4px 8px;border-radius:6px;
  background:#f5f5f5;color:var(--text-light);
}
.hour-chip.booked{background:var(--primary-light);color:var(--primary-dark);}
.hour-chip.closed{background:#fff0f0;color:#ccc;}
.hour-chip.free{background:#e6f4e6;color:#5a8a5a;}

/* 选择会员 */
.member-card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  transition:all .15s;
}
.member-card:hover,.member-card.selected{border-color:var(--primary);background:var(--bg-2);}

/* 直播选题 */
.topic-card{padding:12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;}
.topic-card .ttl{font-weight:500;display:flex;justify-content:space-between;}

/* 响应式 */
@media (max-width:900px){
  .workspace{flex-direction:column;}
  .workspace-sidebar{width:100%;height:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;}
  .sidebar-brand{display:none;}
  .sidebar-nav{display:flex;padding:8px;gap:4px;}
  .nav-group{flex-shrink:0;}
  .nav-group-title{display:none;}
  .nav-item{white-space:nowrap;padding:8px 12px;}
  .nav-item .badge{right:4px;}
  .workspace-header{padding:0 12px;}
  .workspace-content{padding:14px;}
  .form-grid,.form-grid-3{grid-template-columns:1fr;}
  .modal{width:94vw;max-height:90vh;}
  .sch-week{min-width:720px;}
  .sch-month{min-width:640px;}
  .tl-wrap{min-width:760px;}
}

/* ============ 排班管理 ============ */
.sch-tabs{display:flex;gap:6px;background:var(--bg-2);padding:4px;border-radius:var(--radius-sm);width:fit-content;}
.sch-tab{padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-light);transition:.15s;}
.sch-tab.active{background:#fff;color:var(--primary-dark);font-weight:600;box-shadow:var(--shadow-2);}
.sch-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.sch-week{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.sch-week th,.sch-week td{border:1px solid var(--border);padding:0;text-align:center;}
.sch-week th{background:var(--bg-2);padding:8px 4px;font-weight:600;font-size:12px;color:var(--text-light);}
.sch-week th.today{background:var(--primary-light);color:var(--primary-dark);}
.sch-week td.tech-col{width:110px;text-align:left;padding:8px 10px;background:#fffdfd;}
.sch-cell{min-height:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.15s;}
.sch-cell:hover{filter:brightness(.96);}
.sch-cell .s-name{font-weight:600;font-size:12px;}
.sch-cell .s-time{font-size:10px;opacity:.75;}
.sch-cell.empty{color:#d9cfcf;font-size:18px;background:#fff;}
.tech-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
.tech-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;margin-bottom:8px;}
.tech-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7a4a4a;font-size:14px;flex:none;}

/* 图片压缩工具：客户端 File → Canvas 缩放到 800px → JPEG 0.6 → base64 dataURL */
function compressImage(file,maxSide=800,quality=0.6){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type||!file.type.startsWith('image/')){reject(new Error('不是图片'));return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxSide){h=h*(maxSide/w);w=maxSide;}
        else if(h>maxSide){w=w*(maxSide/h);h=maxSide;}
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(w);canvas.height=Math.round(h);
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',quality);
        resolve(data);
      };
      img.onerror=()=>reject(new Error('图片解码失败'));
      img.src=ev.target.result;
    };
    reader.onerror=()=>reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}
/* 估算 base64 dataURL 字节数（用于 localStorage 容量检查） */
function approxBytes(dataUrl){
  if(!dataUrl)return 0;
  const i=dataUrl.indexOf(',');
  const b64=i>=0?dataUrl.slice(i+1):dataUrl;
  return Math.ceil(b64.length*0.75);
}
/* 读取多个 File → 压缩后 base64 数组 */
async function compressImageBatch(files,maxCount){
  const list=Array.from(files).slice(0,maxCount);
  const out=[];
  for(const f of list){
    try{out.push(await compressImage(f));}catch(e){console.warn('跳过:',f.name,e);}
  }
  return out;
}
/* 价格记忆：写入（同名覆盖去重，限 100 条） */
function rememberPrice(itemName,price){
  if(!itemName||!price)return;
  const key=(itemName||'').trim();
  if(!key)return;
  DB.priceMemory=DB.priceMemory.filter(p=>p.itemName!==key);
  DB.priceMemory.unshift({itemName:key,price:+price,ts:Date.now()});
  if(DB.priceMemory.length>100)DB.priceMemory=DB.priceMemory.slice(0,100);
}
/* 查找与 itemName 相关的历史价格（用于报价快捷输入） */
function recallPrices(itemName,limit=5){
  if(!itemName)return DB.priceMemory.slice(0,limit);
  const key=itemName.trim();
  return DB.priceMemory.filter(p=>p.itemName===key||p.itemName.includes(key)||key.includes(p.itemName)).slice(0,limit);
}
/* 周一日期工具：返回 YYYY-MM-DD 字符串 */
function getWeekStart(d){
  const dt=new Date(d);
  const day=dt.getDay()||7; // 周日=0 转为 7
  dt.setDate(dt.getDate()-day+1);
  return ymd(dt);
}
function getWeekDates(weekStartStr){
  const out=[];
  const base=new Date(weekStartStr);
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    out.push({date:ymd(d),day:i,dayLabel:'周'+['一','二','三','四','五','六','日'][i]});
  }
  return out;
}

/* =============================================================
   积分营销规则引擎（打卡送礼）
   ============================================================= */
function RW(){return (DB.settings&&DB.settings.rewards)||DEFAULT_REWARDS;}

/* 11. 是否双倍积分日 */
function isDoubleDay(dateStr){
  const cfg=RW().doubleDay;
  if(!cfg||!cfg.enabled)return false;
  const d=dateStr?new Date(dateStr):new Date();
  if(cfg.mode==='weekday')return d.getDay()===(+cfg.weekday);
  if(cfg.mode==='monthday')return d.getDate()===(+cfg.monthDay);
  return false;
}
function doubleDayLabel(){
  const cfg=RW().doubleDay;
  if(!cfg||!cfg.enabled)return '';
  const WD=['周日','周一','周二','周三','周四','周五','周六'];
  return cfg.mode==='weekday'?`每${WD[+cfg.weekday]}`:`每月${cfg.monthDay}号`;
}

/* 10. 积分有效期 */
function pointsExpireAt(fromTs){
  const cfg=RW().expire;
  if(!cfg||!cfg.enabled)return 0;
  const d=new Date(fromTs||Date.now());
  d.setMonth(d.getMonth()+(+cfg.months||12));
  return d.getTime();
}

/* 通用加分入口：自动应用双倍日、写日志、检查升级 */
function grantPoints(customerId,points,source,reason,opt){
  opt=opt||{};
  const c=DB.customers.find(x=>x.id===customerId);
  if(!c||!points)return 0;
  let final=Math.round(points);
  let dbl=false;
  if(opt.allowDouble!==false&&final>0&&isDoubleDay(opt.date)){
    final=Math.round(final*(+RW().doubleDay.multiplier||2));
    dbl=true;
  }
  c.points=(+c.points||0)+final;
  DB.points_log.unshift({
    id:genId('pl'),date:opt.date||ymd(new Date()),
    customerId:c.id,name:c.name,change:final,
    source:source||'manual',
    reason:(reason||POINT_SOURCES[source]||'调整')+(dbl?` 🎉${RW().doubleDay.label||'双倍日'}×${RW().doubleDay.multiplier}`:''),
    balance:c.points,
    expireAt:final>0?pointsExpireAt():0,
    ts:Date.now()
  });
  if(final>0)checkLevelUp(c);
  return final;
}
/* 扣分（兑换/抵现） */
function spendPoints(customerId,points,source,reason){
  const c=DB.customers.find(x=>x.id===customerId);
  if(!c)return false;
  points=Math.round(Math.abs(points));
  if((+c.points||0)<points)return false;
  c.points=(+c.points)-points;
  DB.points_log.unshift({
    id:genId('pl'),date:ymd(new Date()),
    customerId:c.id,name:c.name,change:-points,
    source:source||'redeem',reason:reason||POINT_SOURCES[source]||'消耗',
    balance:c.points,expireAt:0,ts:Date.now()
  });
  return true;
}

/* 9. 积分自动升级会员 */
function checkLevelUp(c){
  const cfg=RW().levelUp;
  if(!cfg||!cfg.enabled||!cfg.rules||!cfg.rules.length)return;
  const total=+c.points||0;
  const hit=[...cfg.rules].sort((a,b)=>b.points-a.points).find(r=>total>=r.points);
  if(!hit)return;
  const cur=+c.membershipAmount||0;
  if(cur>=hit.amount)return;
  c.membershipAmount=hit.amount;
  if(!c.membershipExpire){
    const d=new Date();d.setMonth(d.getMonth()+12);
    c.membershipExpire=ymd(d);
  }
  const tier=MEMBER_TIERS[String(hit.amount)];
  DB.notifications.unshift({
    id:genId('nt'),date:ymd(new Date())+' '+hm(new Date()),
    customerName:c.name,type:'升级',
    content:`🎉 ${c.name} 积分达 ${total} 分，已自动升级为「${tier?tier.name:hit.amount}」，享 ${tier?(tier.discount*10).toFixed(1):''} 折`,
    createdAt:Date.now()
  });
}

/* 4. 积分抵现计算 */
function calcPointsDeduct(customerId,orderAmount,wantPoints){
  const cfg=RW().deduct;
  const res={usablePoints:0,deductAmount:0,maxAmount:0,reason:''};
  if(!cfg||!cfg.enabled){res.reason='未开启积分抵现';return res;}
  const c=DB.customers.find(x=>x.id===customerId);
  if(!c){res.reason='无客户档案';return res;}
  const bal=+c.points||0;
  const per=+cfg.pointsPerYuan||100;
  res.maxAmount=+(orderAmount*(+cfg.maxPercent||20)/100).toFixed(2);
  const maxByBalance=bal/per;
  const cap=Math.min(res.maxAmount,maxByBalance);
  let amt=wantPoints!=null?Math.min(wantPoints/per,cap):cap;
  amt=Math.floor(amt*100)/100;
  if(amt<=0){res.reason=bal<(+cfg.minPoints||0)?`积分不足（需≥${cfg.minPoints}分）`:'不可抵扣';return res;}
  if(bal<(+cfg.minPoints||0)){res.reason=`积分不足（需≥${cfg.minPoints}分）`;return res;}
  res.deductAmount=amt;
  res.usablePoints=Math.ceil(amt*per);
  return res;
}

/* 3. 每日签到 */
function todaySignedIn(customerId){
  const t=ymd(new Date());
  return DB.signins.some(s=>s.customerId===customerId&&s.date===t);
}
function signinStreak(customerId){
  const days=DB.signins.filter(s=>s.customerId===customerId).map(s=>s.date).sort().reverse();
  if(!days.length)return 0;
  let streak=0;const d=new Date();
  for(let i=0;i<400;i++){
    const ds=ymd(d);
    if(days.includes(ds)){streak++;d.setDate(d.getDate()-1);}
    else if(i===0){d.setDate(d.getDate()-1);}   // 今天还没签，从昨天算
    else break;
  }
  return streak;
}
function doSignin(customerId){
  const cfg=RW().signin;
  if(!cfg||!cfg.enabled)return{ok:false,msg:'签到功能未开启'};
  if(todaySignedIn(customerId))return{ok:false,msg:'今天已经签到过啦'};
  const base=+cfg.dailyPoints||10;
  const rec={id:genId('si'),date:ymd(new Date()),customerId,points:base,ts:Date.now()};
  DB.signins.unshift(rec);
  let got=grantPoints(customerId,base,'signin','每日签到');
  const streak=signinStreak(customerId);
  let bonusMsg='';
  (cfg.streakBonus||[]).forEach(b=>{
    if(streak===(+b.days)){
      const bp=grantPoints(customerId,+b.points,'signin',`连续签到${b.days}天奖励`);
      got+=bp;bonusMsg=` + 连签${b.days}天奖励${bp}分`;
    }
  });
  rec.points=got;
  saveDB();syncChannel();
  return{ok:true,points:got,streak,msg:`签到成功 +${got}分${bonusMsg}`};
}

/* 1. 推荐新客 */
function genReferralCode(c){
  if(typeof c==='string')c=DB.customers.find(x=>x.id===c);
  if(!c)return '';
  if(c.referralCode)return c.referralCode;
  const base=(c.phone||'').slice(-4)||String(Math.floor(Math.random()*9000)+1000);
  c.referralCode='HM'+base+String(Math.floor(Math.random()*90)+10);
  return c.referralCode;
}
function findByReferralCode(code){
  if(!code)return null;
  return DB.customers.find(c=>(c.referralCode||'').toUpperCase()===code.toUpperCase())||null;
}
function applyReferral(refereeId,code,opt){
  const cfg=RW().referral;
  if(!cfg||!cfg.enabled)return{ok:false,msg:'推荐功能未开启'};
  const referrer=findByReferralCode(code);
  const referee=DB.customers.find(c=>c.id===refereeId);
  if(!referrer||!referee)return{ok:false,msg:'推荐码无效'};
  if(referrer.id===referee.id)return{ok:false,msg:'不能推荐自己'};
  if(DB.referrals.some(r=>r.refereeId===referee.id))return{ok:false,msg:'该客户已被推荐过'};
  const pending=cfg.requireConsume&&!(opt&&opt.consumed);
  const rec={
    id:genId('rf'),date:ymd(new Date()),
    referrerId:referrer.id,referrerName:referrer.name,
    refereeId:referee.id,refereeName:referee.name,
    referrerPoints:+cfg.referrerPoints||0,refereePoints:+cfg.refereePoints||0,
    status:pending?'pending':'done',ts:Date.now()
  };
  DB.referrals.unshift(rec);
  if(!pending)settleReferral(rec.id);
  saveDB();syncChannel();
  return{ok:true,pending,msg:pending?'已绑定推荐关系，新客首次消费后双方到账':`推荐成功，双方各得积分`};
}
function settleReferral(refId){
  const r=DB.referrals.find(x=>x.id===refId);
  if(!r||r.status==='done')return false;
  grantPoints(r.referrerId,r.referrerPoints,'referral',`推荐 ${r.refereeName} 到店`);
  grantPoints(r.refereeId,r.refereePoints,'referred',`由 ${r.referrerName} 推荐`);
  r.status='done';r.settledAt=Date.now();
  return true;
}
/* 新客首次消费时自动结算待处理推荐 */
function autoSettleReferralOnConsume(customerId){
  const pend=DB.referrals.filter(r=>r.refereeId===customerId&&r.status==='pending');
  pend.forEach(r=>settleReferral(r.id));
  return pend.length;
}

/* 2. 社交分享 */
function submitShare(customerId,platform,url,note){
  const cfg=RW().share;
  if(!cfg||!cfg.enabled)return{ok:false,msg:'分享奖励未开启'};
  const month=ymd(new Date()).slice(0,7);
  const used=DB.shares.filter(s=>s.customerId===customerId&&s.date.startsWith(month)&&s.status!=='rejected').length;
  if(used>=(+cfg.maxPerMonth||2))return{ok:false,msg:`本月分享奖励已达上限（${cfg.maxPerMonth}次）`};
  const c=DB.customers.find(x=>x.id===customerId);
  const rec={
    id:genId('sh'),date:ymd(new Date()),customerId,customerName:c?c.name:'',
    platform,url,note:note||'',points:+cfg.points||0,
    status:cfg.needAudit?'pending':'approved',ts:Date.now()
  };
  DB.shares.unshift(rec);
  if(!cfg.needAudit)grantPoints(customerId,rec.points,'share',`${platform} 分享奖励`);
  saveDB();syncChannel();
  return{ok:true,msg:cfg.needAudit?'已提交，店家审核通过后积分到账':`分享成功 +${rec.points}分`};
}
function auditShare(shareId,approve){
  const s=DB.shares.find(x=>x.id===shareId);
  if(!s||s.status!=='pending')return false;
  if(approve){s.status='approved';grantPoints(s.customerId,s.points,'share',`${s.platform} 分享奖励（已审核）`);}
  else s.status='rejected';
  s.auditedAt=Date.now();
  saveDB();syncChannel();
  return true;
}

/* 5-8. 积分兑换 */
function redeemReward(customerId,itemId){
  const it=DB.rewardItems.find(x=>x.id===itemId);
  if(!it||!it.enabled)return{ok:false,msg:'该奖品已下架'};
  if(it.stock===0)return{ok:false,msg:'库存不足'};
  const c=DB.customers.find(x=>x.id===customerId);
  if(!c)return{ok:false,msg:'无客户档案'};
  if((+c.points||0)<it.points)return{ok:false,msg:`积分不足（还差 ${it.points-(+c.points||0)} 分）`};
  if(!spendPoints(customerId,it.points,'redeem',`兑换「${it.name}」`))return{ok:false,msg:'扣分失败'};
  if(it.stock>0)it.stock--;
  const code=genRedeemCode();
  const rec={
    id:genId('rd'),date:ymd(new Date()),customerId,customerName:c.name,
    itemId:it.id,itemName:it.name,itemType:it.type,points:it.points,value:it.value,
    code,status:'unused',ts:Date.now()
  };
  DB.redeems.unshift(rec);
  // 优惠券入券包
  if(it.type==='coupon'){
    const exp=new Date();exp.setDate(exp.getDate()+(+it.validDays||60));
    DB.coupons.unshift({
      id:genId('cp'),customerId,customerName:c.name,name:it.name,
      kind:it.value<1?'discount':'cash',value:it.value,
      code,expireDate:ymd(exp),status:'unused',fromRedeem:rec.id,ts:Date.now()
    });
  }
  saveDB();syncChannel();
  return{ok:true,code,msg:`兑换成功！核销码 ${code}`};
}
function genRedeemCode(){
  return String(Math.floor(Math.random()*900000)+100000);
}
function useRedeem(redeemId){
  const r=DB.redeems.find(x=>x.id===redeemId);
  if(!r||r.status==='used')return false;
  r.status='used';r.usedAt=Date.now();
  const cp=DB.coupons.find(x=>x.fromRedeem===r.id);
  if(cp)cp.status='used';
  saveDB();syncChannel();
  return true;
}

/* 10. 扫描过期积分（每次启动跑一次） */
function expireOldPoints(){
  const cfg=RW().expire;
  if(!cfg||!cfg.enabled)return 0;
  const now=Date.now();
  let expired=0;
  const byCust={};
  DB.points_log.forEach(l=>{
    if(l.change>0&&l.expireAt&&l.expireAt<now&&!l.expired&&l.source!=='expire'){
      l.expired=true;
      byCust[l.customerId]=(byCust[l.customerId]||0)+l.change;
    }
  });
  Object.entries(byCust).forEach(([cid,pts])=>{
    const c=DB.customers.find(x=>x.id===cid);
    if(!c)return;
    const cut=Math.min(pts,+c.points||0);
    if(cut<=0)return;
    c.points=(+c.points)-cut;
    expired+=cut;
    DB.points_log.unshift({
      id:genId('pl'),date:ymd(new Date()),customerId:c.id,name:c.name,
      change:-cut,source:'expire',reason:`积分过期作废（有效期${cfg.months}个月）`,
      balance:c.points,expireAt:0,ts:Date.now()
    });
  });
  if(expired>0){saveDB();syncChannel();}
  return expired;
}
/* 即将过期提醒列表 */
function expiringSoonList(){
  const cfg=RW().expire;
  if(!cfg||!cfg.enabled)return [];
  const now=Date.now(),limit=now+(+cfg.remindDays||30)*86400000;
  const map={};
  DB.points_log.forEach(l=>{
    if(l.change>0&&l.expireAt&&!l.expired&&l.expireAt>now&&l.expireAt<=limit){
      if(!map[l.customerId])map[l.customerId]={customerId:l.customerId,name:l.name,points:0,soonest:l.expireAt};
      map[l.customerId].points+=l.change;
      map[l.customerId].soonest=Math.min(map[l.customerId].soonest,l.expireAt);
    }
  });
  return Object.values(map).sort((a,b)=>a.soonest-b.soonest);
}

/* =============================================================
   云端同步层 (Supabase)
   - 预约：每条预约 upsert 到表 appointments（id 唯一）；工作台 watch 全部，客户端按手机号过滤只看自己 → 隐私隔离
   - 其它数据：upsert 到表 sync 文档 main（工作台间同步 + 备份），客户端不读取
   - 客户端配置通过扫码链接 ?sb_url=...&sb_key=... 自动携带，无需手动填写
   ============================================================= */
const CLOUD={
  url:"",key:"",sb:null,ready:false,mode:null,status:"off",
  apptChannel:null,dbChannel:null,apptPoll:null,dbPoll:null,_scriptLoading:null,
  loadScript(){
    if(window.supabase)return Promise.resolve(true);
    if(this._scriptLoading)return this._scriptLoading;
    this._scriptLoading=new Promise(res=>{
      const sc=document.createElement("script");
      sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      sc.onload=()=>res(true);
      sc.onerror=()=>res(false);
      document.head.appendChild(sc);
    });
    return this._scriptLoading;
  },
  async init(config,mode){
    this.url=config.url;this.key=config.key;this.mode=mode;this.status="connecting";
    if(!this.url||!this.key){this.status="error";return{ok:false,msg:"缺少 Supabase URL 或 Key"};}
    const ok=await this.loadScript();
    if(!ok){this.status="error";return{ok:false,msg:"SDK 加载失败（网络或被拦截）"};}
    try{
      this.sb=supabase.createClient(this.url,this.key);
      await this.sb.from("sync").select("id").limit(1);
      this.ready=true;this.status="online";
      return{ok:true};
    }catch(e){this.status="error";return{ok:false,msg:(e&&e.message)||String(e)};}
  },
  async pushAppt(a){
    if(!this.ready)return false;
    try{const{error}=await this.sb.from("appointments").upsert({id:a.id,phone:a.phone||"",data:a});if(error){console.warn("pushAppt",error);return false;}return true;}catch(e){return false;}
  },
  async removeAppt(id){
    if(!this.ready)return false;
    try{await this.sb.from("appointments").delete().eq("id",id);return true;}catch(e){return false;}
  },
  async fetchAppts(phone){
    if(!this.ready)return [];
    try{
      let q=this.sb.from("appointments").select("data");
      if(phone)q=q.eq("phone",phone);
      const{data,error}=await q;
      if(error)return [];
      return (data||[]).map(r=>r.data).filter(Boolean);
    }catch(e){return [];}
  },
  watchAppts(cb,phone){
    if(!this.ready)return;
    try{
      if(this.sb.channel){
        this.apptChannel=this.sb.channel("hemanli-appoint")
          .on("postgres_changes",{event:"*",schema:"public",table:"appointments"},async()=>{const list=await this.fetchAppts(phone);cb(list);})
          .subscribe();
      }
    }catch(e){console.warn("appt realtime",e);}
    this.startApptPoll(cb,phone);
  },
  startApptPoll(cb,phone){
    this.stopPoll();
    this.apptPoll=setInterval(async()=>{const list=await this.fetchAppts(phone);cb(list);},5000);
  },
  stopPoll(){if(this.apptPoll){clearInterval(this.apptPoll);this.apptPoll=null;}},
  dbFragment(){return{customers:DB.customers,transactions:DB.transactions,items:DB.items,memberships:DB.memberships,points_log:DB.points_log,notifications:DB.notifications,settings:DB.settings,technicians:DB.technicians,shifts:DB.shifts,priceMemory:DB.priceMemory,rewardItems:DB.rewardItems,redeems:DB.redeems,signins:DB.signins,referrals:DB.referrals,shares:DB.shares,coupons:DB.coupons,appointments:[]}},
  async pushDB(){
    if(!this.ready)return false;
    try{const{error}=await this.sb.from("sync").upsert({id:"main",data:this.dbFragment()});if(error){console.warn("pushDB",error);return false;}return true;}catch(e){return false;}
  },
  async pullDB(){
    if(!this.ready)return null;
    try{const{data,error}=await this.sb.from("sync").select("data").eq("id","main").single();if(error)return null;return data?data.data:null;}catch(e){return null;}
  },
  watchDB(cb){
    if(!this.ready)return;
    try{
      if(this.sb.channel){
        this.dbChannel=this.sb.channel("hemanli-sync")
          .on("postgres_changes",{event:"*",schema:"public",table:"sync"},async()=>{const f=await this.pullDB();if(f)cb(f);})
          .subscribe();
      }
    }catch(e){console.warn("db realtime",e);}
    if(this.dbPoll)return;
    this.dbPoll=setInterval(async()=>{const f=await this.pullDB();if(f)cb(f);},6000);
  }
};

/* 客户端：只合并自己的预约（按手机号过滤，其它客户数据不进本地） */
function applyApptsForClient(list){
  const me=DB.customers.find(c=>c.id===customerCurrentId);
  const phone=me&&me.phone;
  if(!phone)return;
  list.filter(a=>a.phone===phone).forEach(a=>{
    const ex=DB.appointments.find(x=>x.id===a.id);
    if(ex)Object.assign(ex,a);else DB.appointments.unshift(a);
  });
  saveLocalOnly();
  if(!document.querySelector('.modal-mask'))renderCustomerPage();
}
/* 工作台间：合并其它数据 */
function applyDB(frag){
  if(!frag)return;
  ['customers','transactions','items','memberships','points_log','notifications','settings','technicians','shifts','priceMemory','rewardItems','redeems','signins','referrals','shares','coupons'].forEach(k=>{if(frag[k]!==undefined)DB[k]=frag[k];});

}
async function startWorkbenchCloud(){
  const cfg=DB.settings.cloud;
  const url=(cfg&&cfg.url)||'';
  const key=(cfg&&cfg.key)||'';
  if(!url||!key)return;
  const r=await CLOUD.init({url,key},'workbench');
  if(!r.ok){toast('云端连接失败：'+r.msg);renderCloudStatus&&renderCloudStatus();return;}
  const frag=await CLOUD.pullDB();
  if(frag)applyDB(frag);
  for(const a of DB.appointments){await CLOUD.pushAppt(a);}
  await CLOUD.pushDB();
  CLOUD.watchAppts(list=>applyAppts(list));
  CLOUD.watchDB(frag=>applyDB(frag));
  DB.settings.cloud={provider:'supabase',url,key,enabled:true};
  saveLocalOnly();
  toast('☁️ 云端同步已连接');
  renderCloudStatus&&renderCloudStatus();
}

/* 常驻悬浮的连接状态药丸：工作台始终显示；客户端仅在已自动连接时显示 */
function renderCloudStatusPill(){
  const el=document.getElementById('cloud-pill');
  if(!el)return;
  if(currentMode==='customer'&&CLOUD.mode!=='client'){el.style.display='none';return;}
  el.style.display='';
  const map={
    off:{cls:'off',text:'未开启云端',click:true},
    connecting:{cls:'connecting',text:'连接中…',click:false},
    online:{cls:'online',text:'☁️ 云端已连接',click:false},
    error:{cls:'error',text:'☁️ 连接失败',click:true}
  };
  const s=map[CLOUD.status]||map.off;
  const label=(currentMode==='customer'&&s.text.startsWith('☁️ '))?('云端'+s.text.slice(2)):s.text;
  const pos=(currentMode==='customer')?' pill-top':'';
  el.className='cloud-pill '+s.cls+pos+(s.click&&currentMode!=='customer'?' clickable':'');

function bindSwipe(container){
  let startX=0,curX=0,active=null,swiped=false;
  container.querySelectorAll('.swipe-content').forEach(el=>{
    el.ontouchstart=e=>{
      const t=e.touches[0];startX=t.clientX;curX=0;active=el;swiped=false;
      if(!el.classList.contains('swiped')){container.querySelectorAll('.swipe-content.swiped').forEach(x=>x.classList.remove('swiped'));}
    };
    el.ontouchmove=e=>{
      if(!active)return;
      e.preventDefault();
      const t=e.touches[0];curX=t.clientX-startX;
      const prev=el.classList.contains('swiped')?-80:0;
      let next=Math.min(0,Math.max(-100,prev+curX));
      el.style.transform='translateX('+next+'px)';
    };
    el.ontouchend=()=>{
      if(!active)return;
      const tx=parseInt(el.style.transform.replace(/[^-\d]/g,''))||0;
      if(tx<-40){el.classList.add('swiped');el.style.transform='';}
      else{el.classList.remove('swiped');el.style.transform='';}
      active=null;
    };
    // 桌面拖拽
    el.onmousedown=e=>{
      startX=e.clientX;curX=0;active=el;swiped=false;
      if(!el.classList.contains('swiped')){container.querySelectorAll('.swipe-content.swiped').forEach(x=>x.classList.remove('swiped'));}
      const move=ev=>{
        if(!active)return;
        ev.preventDefault();
        curX=ev.clientX-startX;
        const prev=el.classList.contains('swiped')?-80:0;
        let next=Math.min(0,Math.max(-100,prev+curX));
        el.style.transform='translateX('+next+'px)';
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        const tx=parseInt(el.style.transform.replace(/[^-\d]/g,''))||0;
        if(tx<-40)el.classList.add('swiped');
        else el.classList.remove('swiped');
        el.style.transform='';
        active=null;
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    };
  });
}

function markDepositPaid(id){
  if(!confirm('确认已收到客户定金？将自动写入定金记录'))return;
  const a=DB.appointments.find(x=>x.id===id);if(!a)return;
  if(!a.deposit){toast('该预约尚未设置定金');return;}
  a.depositPaid=true;
  a.depositPaidAt=Date.now();
  a.status='confirmed';
  DB.transactions.unshift({
    id:genId('tx'),date:ymd(new Date()),type:'定金',
    amount:a.deposit,name:'预约定金-'+(a.styleNames&&a.styleNames.join('+')||a.item),
    customerId:a.customerId,customerName:a.name||'',
    createdAt:Date.now(),source:'workbench_deposit',apptId:a.id
  });
  saveDB();syncChannel();
  if(CLOUD.ready)CLOUD.pushAppt(a);
  renderRoute();toast('已标记定金到账');
}
function cancelAppt(id){
  if(!confirm('确定取消该预约？'))return;
  const a=DB.appointments.find(x=>x.id===id);
  if(a){a.status='cancelled';saveDB();syncChannel();renderCurrentRoute();toast('已取消');if(CLOUD.ready)CLOUD.pushAppt(a);}
}
function setApptStatus(id,s){
  const a=DB.appointments.find(x=>x.id===id);
  if(a){a.status=s;saveDB();syncChannel();renderCurrentRoute();toast('已更新');if(CLOUD.ready)CLOUD.pushAppt(a);}
}
function editAppt(id){
  const a=DB.appointments.find(x=>x.id===id);
  if(!a)return;
  openApptEditor(a);
}

let orderState={customer:null,item:null,pay:'cash'};
function selectPayMethod(k){
  orderState.pay=k;
  document.querySelectorAll('.pay-opt').forEach(o=>{
    o.style.background=o.dataset.k===k?'var(--primary-light)':'#fff';
    o.style.borderColor=o.dataset.k===k?'var(--primary-dark)':'var(--border)';
  });
  const tip=document.getElementById('order-card-tip');
  if(k==='card'&&orderState.customer){
    const bal=(+orderState.customer.membershipBalance||0);
    tip.style.display='';
    if(bal>0)tip.innerHTML=`💳 客户当前储值余额 <strong>¥${bal.toFixed(2)}</strong>`;
    else tip.innerHTML='<span class="text-danger">⚠️ 客户未开卡或余额为 0，将按扣卡失败处理</span>';
  }else if(tip){
    tip.style.display='none';
  }
}
function populateOrderCustomers(){
  const sel=document.getElementById('order-customer');
  if(!sel)return;
  sel.innerHTML='<option value="">-- 不选 / 散客 --</option>'+DB.customers.map(c=>`<option value="${c.id}">${c.name} ${c.phone||''}${c.membershipAmount?' ['+getMembershipName(c.membershipAmount)+']':''}</option>`).join('');
  sel.onchange=()=>{orderState.customer=DB.customers.find(c=>c.id===sel.value);recalcOrder();};
}
function filterOrderCustomers(){
  const q=document.getElementById('order-customer-search').value.toLowerCase();
  const sel=document.getElementById('order-customer');
  sel.innerHTML='<option value="">-- 不选 / 散客 --</option>'+DB.customers.filter(c=>{
    return !q||(c.name&&c.name.toLowerCase().includes(q))||(c.phone&&c.phone.includes(q));
  }).map(c=>`<option value="${c.id}">${c.name} ${c.phone||''}${c.membershipAmount?' ['+getMembershipName(c.membershipAmount)+']':''}</option>`).join('');
  sel.onchange=()=>{orderState.customer=DB.customers.find(c=>c.id===sel.value);recalcOrder();};
}
function populateOrderItems(){
  const sel=document.getElementById('order-item');
  sel.innerHTML='<option value="">-- 选择款式 --</option>'+DB.items.map(i=>`<option value="${i.id}">${i.name} ¥${i.price} (${i.duration}分钟)</option>`).join('');
  sel.onchange=()=>{orderState.item=DB.items.find(i=>i.id===sel.value);recalcOrder();};
}
function toggleOrderNew(){
  const o=document.getElementById('order-new');
  o.style.display=o.style.display==='none'?'':'none';
}
function getMembershipName(amt){return MEMBER_TIERS[amt]?MEMBER_TIERS[amt].name:'会员卡';}
function recalcOrder(){
  const itemPrice=orderState.item?orderState.item.price:0;
  const manualAmount=parseFloat(document.getElementById('order-amount')?.value)||0;
  const original=manualAmount||itemPrice;
  let final=original;
  let discountText='无';
  if(orderState.customer&&orderState.customer.membershipAmount&&MEMBER_TIERS[orderState.customer.membershipAmount]){
    const tier=MEMBER_TIERS[orderState.customer.membershipAmount];
    final=original*tier.discount;
    discountText=getMembershipName(orderState.customer.membershipAmount)+' ×'+tier.discount;
  }
  // 积分抵现
  let ptsCut=0,usePts=0,dedNote='';
  const upEl=document.getElementById('order-use-pts');
  if(orderState.customer&&upEl){
    const want=Math.max(0,parseInt(upEl.value)||0);
    const res=calcPointsDeduct(orderState.customer.id,final,want);
    ptsCut=res.deductAmount;usePts=res.usablePoints;
    dedNote=res.reason||`客户 ${orderState.customer.points||0} 分 · 可抵上限 ¥${res.maxAmount.toFixed(2)} · 本次抵 ¥${ptsCut.toFixed(2)}（消耗 ${usePts} 分）`;
    final=Math.max(0,+(final-ptsCut).toFixed(2));
  }else if(upEl){dedNote='请先选择客户';}
  const dtEl=document.getElementById('order-ded-tip');if(dtEl)dtEl.textContent=dedNote;
  const dEl=document.getElementById('order-deduct');if(dEl)dEl.textContent='-¥'+ptsCut.toFixed(2);

  const pointsEl=document.getElementById('order-points-tip');
  if(pointsEl){
    let rate=1.0;
    if(orderState.customer&&orderState.customer.membershipAmount&&MEMBER_TIERS[orderState.customer.membershipAmount]){rate=MEMBER_TIERS[orderState.customer.membershipAmount].pointsRate;}
    if(orderState.item&&orderState.item.pointsMultiple)rate*=orderState.item.pointsMultiple;
    const dbl=isDoubleDay(document.getElementById('order-date')?.value);
    const mul=dbl?(+RW().doubleDay.multiplier||2):1;
    const pts=Math.floor(original*rate)*mul;
    pointsEl.textContent=`本次消费将获得积分：${pts} 分 (倍率 ×${rate.toFixed(1)}${dbl?' · 双倍日 ×'+mul:''})`;
  }
  document.getElementById('order-original').textContent='¥'+original.toFixed(0);
  document.getElementById('order-discount').textContent=discountText;
  document.getElementById('order-final').textContent='¥'+final.toFixed(2);
  if(orderState.pay==='card')selectPayMethod('card');
  else{
    const tip=document.getElementById('order-card-tip');if(tip)tip.style.display='none';
  }
}
function orderMaxPoints(){
  const c=orderState.customer;
  if(!c){toast('请先选择客户');return;}
  const itemPrice=orderState.item?orderState.item.price:0;
  const manual=parseFloat(document.getElementById('order-amount')?.value)||0;
  let base=manual||itemPrice;
  if(c.membershipAmount&&MEMBER_TIERS[c.membershipAmount])base*=MEMBER_TIERS[c.membershipAmount].discount;
  const d=RW().deduct;
  const cap=Math.min(+c.points||0,Math.floor(base*(+d.maxPercent||20)/100*(+d.pointsPerYuan||100)));
  document.getElementById('order-use-pts').value=Math.max(0,cap);
  recalcOrder();
}
function submitOrder(){
  const date=document.getElementById('order-date').value;
  const itemId=document.getElementById('order-item').value;
  const item=DB.items.find(i=>i.id===itemId);
  const manualAmount=parseFloat(document.getElementById('order-amount').value)||0;
  const original=manualAmount||(item?item.price:0);
  if(original<=0){toast('请选择款式或填入金额');return;}
  let customerId=document.getElementById('order-customer').value;
  // 散客模式 - 自填
  const newVisible=document.getElementById('order-new').style.display!=='none';
  if(!customerId&&newVisible){
    const name=document.getElementById('order-name').value.trim();
    const phone=document.getElementById('order-phone').value.trim();
    const birthday=document.getElementById('order-birthday').value;
    if(!name){toast('请填写客户姓名');return;}
    const c={id:genId('c'),name,phone,birthday,createdAt:Date.now(),points:0};
    DB.customers.push(c);
    customerId=c.id;
    orderState.customer=c;
  }else if(!customerId&&!newVisible){
    toast('请选择客户或切换到散客模式');return;
  }
  const customer=DB.customers.find(c=>c.id===customerId);
  let final=original;
  if(customer&&customer.membershipAmount&&MEMBER_TIERS[customer.membershipAmount]){final=original*MEMBER_TIERS[customer.membershipAmount].discount;}
  // 积分抵现
  let usePts=0,ptsCut=0;
  const upEl=document.getElementById('order-use-pts');
  if(customer&&upEl){
    const want=Math.max(0,parseInt(upEl.value)||0);
    if(want>0){
      const res=calcPointsDeduct(customer.id,final,want);
      if(res.deductAmount<=0&&res.reason){toast(res.reason);return;}
      usePts=res.usablePoints;ptsCut=res.deductAmount;
      final=Math.max(0,+(final-ptsCut).toFixed(2));
    }
  }
  // 扣卡校验
  const payMethod=orderState.pay||'cash';
  if(payMethod==='card'){
    if(!customer||!(+customer.membershipBalance>0)){toast('该客户未开卡或余额为 0，无法扣卡');return;}
    if((+customer.membershipBalance)<final){toast(`余额不足（剩 ¥${(+customer.membershipBalance).toFixed(2)}，需 ¥${final.toFixed(2)}）`);return;}
  }
  // 写入消费记录
  const tx={
    id:genId('tx'),
    date,
    type:'收入',
    amount:final,
    name:item?item.name:'自填消费',
    customerId,
    customerName:customer?customer.name:'',
    createdAt:Date.now(),
    source:'manual',
    payMethod
  };
  DB.transactions.unshift(tx);
  // 扣卡
  if(payMethod==='card'&&customer){
    customer.membershipBalance=(+customer.membershipBalance)-final;
    DB.transactions.unshift({
      id:genId('tx'),date,type:'扣卡',amount:final,
      name:item?item.name:'自填消费',customerId:customer.id,customerName:customer.name,
      createdAt:Date.now(),source:'card_deduct',
      payMethod:'card',refTxId:tx.id,
      balanceAfter:(+customer.membershipBalance).toFixed(2)
    });
    DB.memberships.unshift({
      id:genId('ms'),date,customerId:customer.id,customerName:customer.name,
      type:'扣减',amount:-final,note:item?item.name:'自填消费',
      balanceAfter:(+customer.membershipBalance).toFixed(2)
    });
  }
  // 积分自动计算（基于原价，grantPoints 内自动应用双倍日 + 自动升级会员）
  let ptsRate=1.0;
  if(customer&&customer.membershipAmount&&MEMBER_TIERS[customer.membershipAmount]){ptsRate=MEMBER_TIERS[customer.membershipAmount].pointsRate;}
  if(item&&item.pointsMultiple)ptsRate*=item.pointsMultiple;
  let earned=0;
  if(customer){
    // 积分抵现
    if(usePts>0&&ptsCut>0)spendPoints(customer.id,usePts,'deduct',`积分抵现 ¥${ptsCut.toFixed(2)}（${tx.name}）`);
    earned=grantPoints(customer.id,Math.floor(original*ptsRate),'consume',`消费 ${tx.name} ¥${final.toFixed(2)}`,{date});
    const n=autoSettleReferralOnConsume(customer.id);
    if(n)setTimeout(()=>toast(`🎉 推荐奖励已到账（${n} 笔）`),1200);
  }
  tx.earnedPoints=earned;tx.pointsUsed=usePts;tx.pointsDeduct=ptsCut;
  saveDB();syncChannel();
  toast(`开单成功 ¥${final.toFixed(2)}${earned?' · +'+earned+'积分'+(isDoubleDay(date)?' 🎉双倍':''):''}${ptsCut>0?' · 积分抵'+ptsCut.toFixed(2)+'元':''}${payMethod==='card'?' · 扣卡':''}`);
  const upe=document.getElementById('order-use-pts');if(upe)upe.value=0;
  drawOrderList();
  populateOrderCustomers();
  recalcOrder();
}
function drawOrderList(){
  const el=document.getElementById('order-list');
  if(!el)return;
  const arr=DB.transactions.filter(t=>t.type==='收入').slice(0,50);
  if(arr.length===0){el.innerHTML='<div class="empty"><div class="icon">💰</div>暂无消费记录</div>';return;}
  el.innerHTML='<div id="order-rows">'+arr.map(t=>`
    <div class="swipe-wrap" data-id="${t.id}">
      <div class="swipe-action" onclick="deleteTx('${t.id}')">删除</div>
      <div class="swipe-content">
        <div style="display:flex;justify-content:space-between">
          <div><strong>${t.customerName||'(散客)'}</strong> · ${t.name}</div>
          <div class="text-success font-bold">+¥${(+t.amount).toFixed(0)}</div>
        </div>
        <div class="text-muted" style="font-size:12px">${t.date} ${t.source==='crawler'?'· 🔗抓取链接':''}</div>
      </div>
    </div>`).join('')+'</div>';
  bindSwipe(el);
}
function deleteTx(id){
  if(!confirm('删除此记录？积分也将回收'))return;
  const tx=DB.transactions.find(t=>t.id===id);
  if(tx&&tx.customerId){
    const c=DB.customers.find(x=>x.id===tx.customerId);
    if(c&&tx.earnedPoints){c.points=Math.max(0,(+c.points||0)-tx.earnedPoints);}
  }
  DB.transactions=DB.transactions.filter(t=>t.id!==id);
  saveDB();syncChannel();renderCurrentRoute();toast('已删除');
}

function deleteFinance(id){
  if(!confirm('删除？'))return;
  DB.transactions=DB.transactions.filter(t=>t.id!==id);
  saveDB();syncChannel();renderCurrentRoute();toast('已删除');
}

/* =============================================================
   快速结算（从预约一键开单 + 扣卡 + 积分 + 完成预约）
   ============================================================= */
let _qsState={pay:'cash',apptId:null,rate:1,discount:1,usePoints:0,couponId:''};
function openQuickSettle(apptId){
  const a=DB.appointments.find(x=>x.id===apptId);
  if(!a){toast('预约不存在');return;}
  _qsState.apptId=apptId;
  const cust=a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
  const itm=(a.item||(a.styleNames&&a.styleNames[0]))?(DB.items.find(i=>i.name===(a.item||a.styleNames[0]))||null):null;
  const quotedPrice=(+a.quotedPrice)||(itm?itm.price:0);
  const tier=cust&&cust.membershipAmount&&MEMBER_TIERS[cust.membershipAmount]?MEMBER_TIERS[cust.membershipAmount]:null;
  const discountRate=tier?tier.discount:1;
  const ptsRate=(tier?tier.pointsRate:1)*(itm&&itm.pointsMultiple?itm.pointsMultiple:1);
  _qsState.rate=ptsRate;
  _qsState.discount=discountRate;
  _qsState.usePoints=0;
  _qsState.couponId='';
  const dcfg=RW().deduct;
  const dbl=isDoubleDay(a.date);
  const dblMul=+RW().doubleDay.multiplier||2;
  const earnPts=Math.floor(quotedPrice*ptsRate)*(dbl?dblMul:1);
  const bal=cust?(+cust.points||0):0;
  const today=ymd(new Date());
  const myCoupons=cust?DB.coupons.filter(cp=>cp.customerId===cust.id&&cp.status==='unused'&&cp.expireDate>=today):[];
  const canDeduct=cust&&dcfg.enabled&&bal>=(+dcfg.minPoints||0);

  showModal(`💰 快速结算 · ${a.name||''}`,`
    <div style="background:var(--bg-2);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px">
      <div>👤 客户：<strong>${a.name||'(散客)'}</strong>${cust&&cust.phone?' · '+cust.phone:''}${cust?` · ⭐${bal}分`:''}</div>
      <div>📅 预约：${a.date} ${a.startTime||''}-${a.endTime||''}</div>
      <div>💅 项目：${a.item||(a.styleNames&&a.styleNames.join('+'))||'未填'}</div>
    </div>
    ${dbl?`<div style="background:#fff7e6;border:1px solid #f6d68a;border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:#92400e">
      🎉 今天是<strong>${RW().doubleDay.label||'双倍积分日'}</strong>，本单积分自动 ×${dblMul}</div>`:''}
    <div class="form-grid">
      <div><label class="form-label">原价 ¥</label><input id="qs-original" type="number" value="${quotedPrice.toFixed(0)}" oninput="recalcQS()"></div>
      <div><label class="form-label">会员折扣</label>
        <div style="padding:10px 0;font-size:13px" id="qs-tier">${tier?tier.name+' ×'+tier.discount+'（自动）':'无'}</div>
      </div>
    </div>

    ${myCoupons.length?`<label class="form-label">🎫 使用优惠券</label>
    <select id="qs-coupon" onchange="_qsState.couponId=this.value;recalcQS()" style="margin-bottom:10px">
      <option value="">不使用</option>
      ${myCoupons.map(cp=>`<option value="${cp.id}">${cp.name}（${cp.kind==='discount'?(cp.value*10).toFixed(1)+'折':'抵¥'+cp.value}，${cp.expireDate}到期）</option>`).join('')}
    </select>`:''}

    ${canDeduct?`<label class="form-label">⭐ 积分抵现（${dcfg.pointsPerYuan}分=1元，最多抵 ${dcfg.maxPercent}%）</label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
      <input id="qs-use-pts" type="number" min="0" step="${dcfg.pointsPerYuan}" value="0" placeholder="使用积分数" oninput="recalcQS()" style="flex:1">
      <button class="btn sm" onclick="qsMaxPoints()">用满</button>
      <button class="btn sm" onclick="document.getElementById('qs-use-pts').value=0;recalcQS()">清空</button>
    </div>
    <div id="qs-ded-tip" class="text-muted" style="font-size:12px;margin-bottom:10px"></div>`
    :(cust&&dcfg.enabled?`<div class="text-muted" style="font-size:12px;margin-bottom:10px">⭐ 积分 ${bal} 分，不足 ${dcfg.minPoints} 分暂不可抵现</div>`:'')}

/* 计算结算明细：原价 → 会员折扣 → 优惠券 → 积分抵现 → 实付 */
function qsCompute(){
  const a=DB.appointments.find(x=>x.id===_qsState.apptId)||{};
  const cust=a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
  const orig=parseFloat((document.getElementById('qs-original')||{}).value)||0;
  const rate=_qsState.discount||1;
  const afterTier=+(orig*rate).toFixed(2);
  // 优惠券
  let couponCut=0,coupon=null;
  if(_qsState.couponId){
    coupon=DB.coupons.find(c=>c.id===_qsState.couponId)||null;
    if(coupon)couponCut=coupon.kind==='discount'?+(afterTier*(1-coupon.value)).toFixed(2):Math.min(+coupon.value,afterTier);
  }
  const afterCoupon=Math.max(0,+(afterTier-couponCut).toFixed(2));
  // 积分抵现
  let usePts=0,ptsCut=0,dedNote='';
  const el=document.getElementById('qs-use-pts');
  if(cust&&el){
    const want=Math.max(0,parseInt(el.value)||0);
    const res=calcPointsDeduct(cust.id,afterCoupon,want);
    ptsCut=res.deductAmount;usePts=res.usablePoints;
    dedNote=res.reason||`可抵上限 ¥${res.maxAmount.toFixed(2)}，本次抵扣 ¥${ptsCut.toFixed(2)}（消耗 ${usePts} 分）`;
  }
  const final=Math.max(0,+(afterCoupon-ptsCut).toFixed(2));
  const dbl=isDoubleDay(a.date);
  const earn=Math.floor(final*(_qsState.rate||1))*(dbl?(+RW().doubleDay.multiplier||2):1);
  return {orig,rate,afterTier,coupon,couponCut,afterCoupon,usePts,ptsCut,dedNote,final,earn,dbl,cust};
}
function recalcQS(){
  const r=qsCompute();
  _qsState.usePoints=r.usePts;
  const bd=document.getElementById('qs-breakdown');
  if(bd)bd.innerHTML=`
    <div style="display:flex;justify-content:space-between;padding:2px 0"><span class="text-muted">原价</span><span>¥${r.orig.toFixed(2)}</span></div>
    ${r.rate<1?`<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="text-muted">会员折扣 ×${r.rate}</span><span style="color:var(--success)">-¥${(r.orig-r.afterTier).toFixed(2)}</span></div>`:''}
    ${r.couponCut>0?`<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="text-muted">🎫 ${r.coupon.name}</span><span style="color:var(--success)">-¥${r.couponCut.toFixed(2)}</span></div>`:''}
    ${r.ptsCut>0?`<div style="display:flex;justify-content:space-between;padding:2px 0"><span class="text-muted">⭐ 积分抵现 ${r.usePts} 分</span><span style="color:var(--success)">-¥${r.ptsCut.toFixed(2)}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;border-top:1px dashed var(--border);margin-top:6px;padding-top:8px">
      <strong>实付金额</strong><strong style="font-size:19px;color:var(--primary-dark)">¥${r.final.toFixed(2)}</strong>
    </div>`;
  const fe=document.getElementById('qs-final');if(fe)fe.textContent='¥'+r.final.toFixed(2);
  const dt=document.getElementById('qs-ded-tip');if(dt)dt.textContent=r.dedNote;
  const pe=document.getElementById('qs-pts');if(pe)pe.textContent=r.earn;
  if(_qsState.pay==='card')selectQSPay('card');
}
function qsMaxPoints(){
  const r=qsCompute();
  const cust=r.cust;if(!cust)return;
  const d=RW().deduct;
  const cap=Math.min(+cust.points||0,Math.floor(r.afterCoupon*(+d.maxPercent||20)/100*(+d.pointsPerYuan||100)));
  document.getElementById('qs-use-pts').value=Math.max(0,cap);
  recalcQS();
}
function selectQSPay(k){
  _qsState.pay=k;
  document.querySelectorAll('.qs-pay-opt').forEach(o=>{
    o.style.background=o.dataset.k===k?'var(--primary-light)':'#fff';
    o.style.borderColor=o.dataset.k===k?'var(--primary-dark)':'var(--border)';
  });
  const tip=document.getElementById('qs-card-tip');
  const ab=document.getElementById('qs-after-bal');
  if(k==='card'){
    const a=DB.appointments.find(x=>x.id===_qsState.apptId);
    const cust=a&&a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
    const bal=cust?(+cust.membershipBalance||0):0;
    const final=parseFloat(document.getElementById('qs-final').textContent.replace(/[¥,]/g,''))||0;
    tip.style.display='';
    if(!cust){tip.innerHTML='<span class="text-danger">⚠️ 该预约无客户档案，无法扣卡</span>';ab.style.display='none';return;}
    if(bal<=0){tip.innerHTML='<span class="text-danger">⚠️ 客户未开卡或余额为 0</span>';ab.style.display='none';return;}
    if(bal<final){
      tip.innerHTML=`<span class="text-danger">⚠️ 余额不足（剩 ¥${bal.toFixed(2)}，需 ¥${final.toFixed(2)}）</span>`;
      ab.style.display='none';return;
    }
    tip.innerHTML=`💳 当前储值余额 <strong>¥${bal.toFixed(2)}</strong>`;
    ab.style.display='';document.getElementById('qs-bal-num').textContent=(bal-final).toFixed(2);
  }else if(tip){tip.style.display='none';ab.style.display='none';}
}
function submitQuickSettle(){
  const apptId=_qsState.apptId;
  const a=DB.appointments.find(x=>x.id===apptId);
  if(!a){toast('预约不存在');return;}
  const cust=a.customerId?DB.customers.find(c=>c.id===a.customerId):null;
  const R=qsCompute();
  const orig=R.orig, final=R.final;
  if(orig<=0){toast('请填写原价');return;}
  const pay=_qsState.pay;
  if(pay==='card'){
    if(!cust){toast('该预约无客户档案，无法扣卡');return;}
    if((+cust.membershipBalance)<final){toast('余额不足，无法扣卡');return;}
  }
  const itm=a.item?DB.items.find(i=>i.name===a.item):null;
  const date=a.date||ymd(new Date());
  const itemName=itm?itm.name:(a.styleNames&&a.styleNames.join('+'))||a.item||'预约消费';
  DB.transactions.unshift({
    id:genId('tx'),date,type:'收入',amount:final,
    name:itemName,
    customerId:a.customerId,customerName:a.name||'',
    createdAt:Date.now(),source:'appointment',apptId:a.id,payMethod:pay
  });
  if(pay==='card'&&cust){
    cust.membershipBalance=(+cust.membershipBalance)-final;
    DB.transactions.unshift({
      id:genId('tx'),date,type:'扣卡',amount:final,
      name:itemName,customerId:cust.id,customerName:cust.name,
      createdAt:Date.now(),source:'card_deduct',
      payMethod:'card',refApptId:a.id,
      balanceAfter:(+cust.membershipBalance).toFixed(2)
    });
    DB.memberships.unshift({
      id:genId('ms'),date,customerId:cust.id,customerName:cust.name,
      type:'扣减',amount:-final,note:itemName,
      balanceAfter:(+cust.membershipBalance).toFixed(2)
    });
  }
  // 核销优惠券
  if(R.coupon&&R.couponCut>0){
    R.coupon.status='used';R.coupon.usedAt=Date.now();R.coupon.usedApptId=a.id;
    const rd=DB.redeems.find(x=>x.id===R.coupon.fromRedeem);
    if(rd&&rd.status==='unused'){rd.status='used';rd.usedAt=Date.now();}
  }
  // 扣减抵现积分
  if(cust&&R.usePts>0&&R.ptsCut>0){
    spendPoints(cust.id,R.usePts,'deduct',`积分抵现 ¥${R.ptsCut.toFixed(2)}（${itemName}）`);
  }
  // 发放消费积分（grantPoints 内自动应用双倍日 + 自动升级会员）
  let earned=0;
  if(cust){
    earned=grantPoints(cust.id,Math.floor(final*(_qsState.rate||1)),'consume',`消费 ${itemName} ¥${final.toFixed(2)}`,{date});
    // 新客首次消费 → 结算待处理推荐奖励
    const n=autoSettleReferralOnConsume(cust.id);
    if(n)setTimeout(()=>toast(`🎉 推荐奖励已到账（${n} 笔）`),1200);
  }
  a.status='completed';
  a.finalPrice=final;
  a.originalPrice=orig;
  a.pointsUsed=R.usePts;
  a.pointsDeduct=R.ptsCut;
  a.couponId=R.coupon?R.coupon.id:'';
  a.couponCut=R.couponCut;
  a.pointsEarned=earned;
  a.payMethod=pay;
  a.completedAt=Date.now();
  if(!a.technicianId){
    for(const t of activeTechs()){if(getShift(t.id,a.date)){a.technicianId=t.id;break;}}
  }
  saveDB();syncChannel();
  if(CLOUD.ready)CLOUD.pushAppt(a);
  document.querySelector('.modal-mask').remove();
  renderRoute();
  const bits=[`已结算 ¥${final.toFixed(2)}`];
  if(earned)bits.push(`+${earned}积分${R.dbl?' 🎉双倍':''}`);
  if(R.ptsCut>0)bits.push(`积分抵${R.ptsCut.toFixed(2)}元`);
  if(R.couponCut>0)bits.push(`券减${R.couponCut.toFixed(2)}元`);
  if(pay==='card')bits.push(`扣卡 ¥${final.toFixed(2)}`);
  toast(bits.join(' · '));
}

/* ---- 月视图：全局排班一览 ---- */
function renderSchMonth(b){
  const [y,m]=SCH.month.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const today=ymd(new Date());
  const cells=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d);}
  const WD=['一','二','三','四','五','六','日'];
  b.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn sm" onclick="shiftMonth(-1)">‹</button>
      <strong style="font-size:14px">${y}年${m}月</strong>
      <button class="btn sm" onclick="shiftMonth(1)">›</button>
      <button class="btn sm" onclick="SCH.month=ymd(new Date()).slice(0,7);renderRoute()">本月</button>
      <span class="text-muted" style="font-size:12px;margin-left:auto">点击日期查看当天时间轴</span>
    </div>
    <div class="sch-scroll"><div class="sch-month">
      ${WD.map(w=>`<div class="mh">周${w}</div>`).join('')}
      ${cells.map(d=>{
        const ds=ymd(d);const out=d.getMonth()!==m-1;
        const ss=shiftsOfDate(ds);
        const ac=apptsOfDate(ds).length;
        return `<div class="md ${out?'out':''} ${ds===today?'today':''}" onclick="SCH.day='${ds}';SCH.view='day';renderRoute()">
          <div class="dnum">${d.getDate()}</div>
          ${ss.slice(0,3).map(s=>{
            const t=techById(s.technicianId);const st=SHIFT_TYPES[s.type];
            if(!t||!st)return '';
            return `<div class="mchip" style="background:${st.color};color:${st.textColor}">${st.short}·${t.name}</div>`;
          }).join('')}
          ${ss.length>3?`<div class="mchip" style="background:#f3f4f6;color:#6b7280">+${ss.length-3}人</div>`:''}
          ${ac?`<div style="font-size:10px;color:var(--primary-dark);margin-top:1px">📅${ac}单</div>`:''}
        </div>`;
      }).join('')}
    </div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px">
      ${Object.entries(SHIFT_TYPES).filter(([k])=>k!=='rest').map(([k,v])=>`<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:14px;border-radius:3px;background:${v.color};display:inline-block"></span>${v.label}</span>`).join('')}
    </div>
  `;
}
function shiftMonth(n){
  const [y,m]=SCH.month.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  SCH.month=ymd(d).slice(0,7);renderRoute();
}

/* ---- 日时间轴：各美甲师班次 + 预约占用 ---- */
function renderSchDay(b){
  const date=SCH.day;
  const techs=activeTechs();
  const H0=9,H1=21,SPAN=H1-H0;
  const ticks=[];for(let h=H0;h<H1;h++)ticks.push(h);
  const appts=apptsOfDate(date);
  const pos=(t)=>{const {h,m}=parseHM(t);return ((h+m/60-H0)/SPAN)*100;};
  const unassigned=appts.filter(a=>!a.technicianId||!techById(a.technicianId));
  if(!techs.length){b.innerHTML='<div class="empty"><div class="icon">🗓️</div>请先添加美甲师</div>';return;}
  b.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn sm" onclick="shiftDay(-1)">‹ 前一天</button>
      <input type="date" value="${date}" style="width:auto" onchange="SCH.day=this.value;renderRoute()">
      <button class="btn sm" onclick="shiftDay(1)">后一天 ›</button>
      <button class="btn sm" onclick="SCH.day=ymd(new Date());renderRoute()">今天</button>
      <span class="text-muted" style="font-size:12px;margin-left:auto">当日 ${appts.length} 个预约 · ${shiftsOfDate(date).length} 人上班</span>
    </div>
    <div class="sch-scroll"><div class="tl-wrap" style="--tlstep:${100/SPAN}%">
      <div class="tl-head"><div class="tl-name">时间</div><div class="tl-track">${ticks.map(h=>`<div class="tl-tick">${String(h).padStart(2,'0')}:00</div>`).join('')}</div></div>
      ${techs.map(t=>{
        const s=getShift(t.id,date);const st=s?SHIFT_TYPES[s.type]:null;
        const my=appts.filter(a=>a.technicianId===t.id);
        let blk='';
        if(st&&st.start!=='-'){
          const L=pos(st.start),W=pos(st.end)-L;
          blk=`<div class="tl-block" style="left:${L}%;width:${W}%;background:${st.color};color:${st.textColor}">${st.label} ${st.start}-${st.end}</div>`;
        }else if(st){
          blk=`<div class="tl-block" style="left:2px;background:#f3f4f6;color:#6b7280;padding:0 8px">休息</div>`;
        }
        const ab=my.map(a=>{
          const st0=a.startTime||'10:00';
          const L=pos(st0);
          const W=Math.max((a.endTime?pos(a.endTime)-L:(1/SPAN)*100),5);
          return `<div class="tl-appt" style="left:${L}%;width:${W}%" onclick="event.stopPropagation();editAppt('${a.id}')" title="${a.name||''} ${a.item||''}">${st0} ${a.name||''}</div>`;
        }).join('');
        return `<div class="tl-row">
          <div class="tl-name"><span class="tech-dot" style="background:${t.color}"></span><span style="font-weight:600">${t.name}</span></div>
          <div class="tl-track" onclick="openShiftPicker('${t.id}','${date}')" style="cursor:pointer">${blk}${ab}</div>
        </div>`;
      }).join('')}
    </div></div>
    ${unassigned.length?`<div class="mt-2" style="padding:10px 12px;background:var(--bg-2);border-radius:var(--radius-sm)">
      <div style="font-size:12px;color:var(--text-light);margin-bottom:6px">⚠️ 未指派美甲师的预约（${unassigned.length}）</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${unassigned.map(a=>`<span class="tag" style="cursor:pointer" onclick="editAppt('${a.id}')">${a.startTime||''} ${a.name||''}</span>`).join('')}
      </div>
    </div>`:''}
  `;
}
function shiftDay(n){
  const d=new Date(SCH.day);d.setDate(d.getDate()+n);
  SCH.day=ymd(d);renderRoute();
}

  if(p){const c=DB.customers.find(x=>x.id===p.customerId);if(c)c.points=Math.max(0,(+c.points||0)-p.change);}
  DB.points_log=DB.points_log.filter(x=>x.id!==id);
  saveDB();syncChannel();renderCurrentRoute();toast('已删除');
}
function addPointsManual(){
  const cid=document.getElementById('pt-customer').value;
  const change=parseInt(document.getElementById('pt-change').value);
  const reason=document.getElementById('pt-reason').value.trim();
  if(!cid){toast('请选择客户');return;}
  if(!change){toast('请输入变动分值');return;}
  if(!reason){toast('请输入原因');return;}
  const c=DB.customers.find(x=>x.id===cid);
  if(!c)return;
  c.points=Math.max(0,(+c.points||0)+change);
  DB.points_log.unshift({id:genId('pl'),date:ymd(new Date()),customerId:c.id,name:c.name,change,reason,balance:c.points});
  saveDB();syncChannel();renderCurrentRoute();toast('已调整');
}

function rwStreak(i,field,val){
  const arr=DB.settings.rewards.signin.streakBonus||[];
  if(field==='add')arr.push({days:60,points:300});
  else if(field==='del')arr.splice(i,1);
  else arr[i][field]=val;
  DB.settings.rewards.signin.streakBonus=arr;
  saveDB();syncChannel();renderRoute();toast('已保存');
}
function rwLevel(i,field,val){
  const arr=DB.settings.rewards.levelUp.rules||[];
  if(field==='add')arr.push({points:5000,amount:500});
  else if(field==='del')arr.splice(i,1);
  else arr[i][field]=val;
  arr.sort((a,b)=>a.points-b.points);
  DB.settings.rewards.levelUp.rules=arr;
  saveDB();syncChannel();renderRoute();toast('已保存');
}
function notifyExpiring(){
  const l=expiringSoonList();
  if(!l.length){toast('暂无需要提醒的客户');return;}
  l.forEach(x=>{
    const c=DB.customers.find(y=>y.id===x.customerId);
    DB.notifications.unshift({
      id:genId('nt'),date:ymd(new Date())+' '+hm(new Date()),
      customerName:x.name,type:'积分到期',
      content:`亲爱的${x.name}，您有 ${x.points} 积分将于 ${ymd(new Date(x.soonest))} 到期，记得来店里兑换好礼哦～`,
      phone:c?c.phone:'',createdAt:Date.now()
    });
  });
  saveDB();syncChannel();renderRoute();
  toast(`已生成 ${l.length} 条提醒，可在通知中心一键发送`);
}

function calcYearProfit(){const y=new Date().getFullYear();let r=0,e=0;DB.transactions.forEach(t=>{const d=new Date(t.date);if(d.getFullYear()===y){if(t.type==='收入')r+=(+t.amount);if(t.type==='支出')e+=(+t.amount);}});return (r-e).toFixed(0);}
function calcMonthProfit(){const y=new Date().getFullYear(),m=new Date().getMonth();let r=0,e=0;DB.transactions.forEach(t=>{const d=new Date(t.date);if(d.getFullYear()===y&&d.getMonth()===m){if(t.type==='收入')r+=(+t.amount);if(t.type==='支出')e+=(+t.amount);}});return (r-e).toFixed(0);}
function calcWeekRevenue(){let r=0;const now=new Date(),weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay());DB.transactions.forEach(t=>{if(t.type!=='收入')return;const d=new Date(t.date);if(d>=weekStart)r+=(+t.amount);});return r.toFixed(0);}
function calcAvgOrder(){const txs=DB.transactions.filter(t=>t.type==='收入');return txs.length?(txs.reduce((s,t)=>s+(+t.amount),0)/txs.length).toFixed(0):'0';}
function monthlyStats(){
  const y=new Date().getFullYear();
  const arr=[];
  for(let m=0;m<12;m++){let r=0,e=0;DB.transactions.forEach(t=>{const d=new Date(t.date);if(d.getFullYear()===y&&d.getMonth()===m){if(t.type==='收入')r+=(+t.amount);if(t.type==='支出')e+=(+t.amount);}});
  arr.push({month:`${m+1}月`,revenue:r.toFixed(0),revenue_num:r,expense:e.toFixed(0),profit:(r-e).toFixed(0),margin:r?((r-e)/r*100).toFixed(1)+'%':'0%'});
  }
  return arr;
}

function monthSum(type){const y=new Date().getFullYear(),m=new Date().getMonth();let s=0;DB.transactions.forEach(t=>{if(t.type!==type)return;const d=new Date(t.date);if(d.getFullYear()===y&&d.getMonth()===m)s+=(+t.amount);});return s;}
function submitFinance(){
  const type=document.getElementById('fin-type').value;
  const amount=parseFloat(document.getElementById('fin-amount').value);
  const date=document.getElementById('fin-date').value;
  const name=document.getElementById('fin-name').value.trim();
  const note=document.getElementById('fin-note').value.trim();
  if(!amount||!name||!date){toast('请完整填写');return;}
  DB.transactions.unshift({id:genId('tx'),type,amount,date,name,note,createdAt:Date.now()});
  saveDB();syncChannel();renderCurrentRoute();toast('已记录');
}

function renderCrawler(el){
  el.innerHTML=`
    <div class="notice-bar">💡 支持抖音、小红书、淘宝、京东、拼多多、1688链接。粘贴链接后自动识别并预览。</div>

      </div>
      <div id="crawl-result"></div>
    </div>
  `;
}
window._lastCrawl=null;
async function crawlLink(){
  const url=document.getElementById('crawl-url').value.trim();
  if(!url){toast('请粘贴链接');return;}
  // 简化的链接抓取 (本地解析预览)
  const platform=identifyPlatform(url);
  const preview={
    platform,
    url,
    title:'来自'+platform+'的款式',
    cover:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="#f7e3e3"/><text x="40" y="46" text-anchor="middle" fill="#c4797b" font-size="14">'+platform+'</text></svg>'),
    extractedAt:new Date().toLocaleString()
  };
  document.getElementById('crawl-result').innerHTML=`
    <div class="preview-card">
      <div class="preview-row">
        <img class="preview-cover" src="${preview.cover}">
        <div style="flex:1">
          <div style="font-weight:600;margin-bottom:4px">${preview.title}</div>
          <div class="text-muted" style="font-size:12px">${platform} · ${url.slice(0,40)}...</div>
          <div class="text-muted mt-1" style="font-size:11px">抓取于 ${preview.extractedAt}</div>
        </div>
      </div>
      <div class="form-grid mt-2">
        <input id="crawl-price" type="number" placeholder="🔢 设置价格 (如参考进价)">
        <select id="crawl-customer">
          <option value="">-- 关联客户(可选) --</option>
          ${DB.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>
      <button class="btn primary mt-2" onclick="saveCrawl()">💾 保存到消费记录</button>
    </div>
  `;
  window._lastCrawl=preview;
}
function identifyPlatform(url){
  if(/douyin|抖音/i.test(url))return '抖音';
  if(/xiaohongshu|小红书|redbook/i.test(url))return '小红书';
  if(/taobao|tmall|淘宝/i.test(url))return '淘宝';
  if(/jd\.com|京东/i.test(url))return '京东';
  if(/pinduoduo|拼多多|pdd/i.test(url))return '拼多多';
  if(/1688|alibaba|阿里巴巴/i.test(url))return '1688';
  if(/weixin|微信|wechat/i.test(url))return '微信';
  if(/alipay|支付宝/i.test(url))return '支付宝';
  return '外链';
}
function saveCrawl(){
  const c=window._lastCrawl;
  if(!c){toast('无预览');return;}
  const price=parseFloat(document.getElementById('crawl-price').value)||0;
  const custId=document.getElementById('crawl-customer').value;
  const cust=DB.customers.find(x=>x.id===custId);
  let final=price;
  if(cust&&cust.membershipAmount&&MEMBER_TIERS[cust.membershipAmount]){final=price*MEMBER_TIERS[cust.membershipAmount].discount;}
  DB.transactions.unshift({id:genId('tx'),date:ymd(new Date()),type:'收入',amount:final,name:c.title+'-'+c.platform,customerId:custId,customerName:cust?cust.name:'',sourceUrl:c.url,source:'crawler'});
  if(cust&&final>0){
    let ptsRate=1.0;
    if(MEMBER_TIERS[cust.membershipAmount])ptsRate=MEMBER_TIERS[cust.membershipAmount].pointsRate;
    const earn=Math.floor(price*ptsRate);
    cust.points=(+cust.points||0)+earn;
    DB.points_log.unshift({id:genId('pl'),date:ymd(new Date()),customerId:cust.id,name:cust.name,change:earn,reason:'消费 '+c.title,balance:cust.points});
  }
  saveDB();syncChannel();toast('已保存');document.getElementById('crawl-result').innerHTML='';document.getElementById('crawl-url').value='';
}
